<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harz Store — Instant Digital Products</title>
  <meta name="description" content="Premium digital products from Harz Ecosystem. Pay via bank transfer, USSD, or card. Instant delivery.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; max-width: 600px; margin: 0 auto; padding: 0; }
    .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 24px 20px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(0,0,0,0.5); }
    .header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, #00d4ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { font-size: 13px; color: #888; margin-top: 4px; }
    .pay-banner { background: #0d4d2f; padding: 12px 20px; text-align: center; font-size: 13px; color: #4ade80; border-bottom: 1px solid #1a3a2a; }
    .pay-banner b { color: #fff; }
    .search { padding: 12px 16px; background: #111; position: sticky; top: 60px; z-index: 99; }
    .search input { width: 100%; padding: 10px 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    .search input:focus { border-color: #00d4ff; }
    .cat-tabs { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; background: #0f0f0f; scrollbar-width: none; }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab { white-space: nowrap; padding: 6px 14px; background: #1a1a1a; border-radius: 20px; font-size: 12px; color: #aaa; cursor: pointer; border: 1px solid #222; }
    .cat-tab.active { background: #00d4ff; color: #000; border-color: #00d4ff; font-weight: 600; }
    .products { padding: 12px; }
    .product { background: #141414; border: 1px solid #222; border-radius: 14px; padding: 16px; margin-bottom: 12px; transition: transform 0.2s, border-color 0.2s; }
    .product:hover { border-color: #00d4ff; transform: translateY(-2px); }
    .product .cat-badge { display: inline-block; font-size: 10px; padding: 3px 8px; background: #1e293b; color: #60a5fa; border-radius: 4px; margin-bottom: 8px; }
    .product h3 { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 6px; line-height: 1.3; }
    .product .price { font-size: 20px; font-weight: 700; color: #4ade80; margin: 8px 0; }
    .product .price .cur { font-size: 13px; color: #888; font-weight: 400; }
    .pay-options { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .pay-btn { flex: 1; min-width: 130px; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; border: none; transition: transform 0.15s; }
    .pay-btn:active { transform: scale(0.97); }
    .btn-paystack { background: #00C7B7; color: #fff; }
    .btn-bank { background: #1e293b; color: #93c5fd; border: 1px solid #334155; }
    .btn-whatsapp { background: #25D366; color: #fff; }
    .btn-usdt { background: #26A17B; color: #fff; }
    .bank-info { display: none; margin-top: 10px; padding: 12px; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; font-size: 12px; }
    .bank-info.show { display: block; }
    .bank-info .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #222; }
    .bank-info .row:last-child { border: none; }
    .bank-info .label { color: #888; }
    .bank-info .val { color: #fff; font-weight: 600; }
    .bank-info .copy { cursor: pointer; color: #00d4ff; font-size: 11px; }
    .footer { text-align: center; padding: 20px; color: #555; font-size: 12px; }
    .footer a { color: #00d4ff; text-decoration: none; }
    .mode-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
    .mode-test { background: #44220a; color: #fbbf24; }
    .mode-live { background: #0d4d2f; color: #4ade80; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: #141414; border-radius: 16px; padding: 24px; max-width: 380px; width: 90%; border: 1px solid #333; }
    .modal h2 { font-size: 18px; color: #fff; margin-bottom: 12px; }
    .modal input { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 10px; }
    .modal button { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 4px; }
    .modal .btn-submit { background: #00C7B7; color: #fff; }
    .modal .btn-close { background: #333; color: #aaa; margin-top: 8px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #333; border-top-color: #00d4ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>Harz Store</h1>
    <p>Premium Digital Products • Instant Delivery</p>
  </div>

  <div class="pay-banner">
    Pay via <b>Bank Transfer</b> • <b>USSD</b> • <b>Card</b> • <b>Crypto</b> — Get products instantly!
  </div>

  <div class="search">
    <input type="text" id="search" placeholder="Search products..." oninput="filterProducts()">
  </div>

  <div class="cat-tabs" id="catTabs">
    <div class="cat-tab active" onclick="filterCategory('all')">All</div>
    <div class="cat-tab" onclick="filterCategory('Developer Tools')">Dev Tools</div>
    <div class="cat-tab" onclick="filterCategory('CAD/BIM Tools')">CAD/BIM</div>
    <div class="cat-tab" onclick="filterCategory('Courses')">Courses</div>
    <div class="cat-tab" onclick="filterCategory('Business Templates')">Templates</div>
    <div class="cat-tab" onclick="filterCategory('AI Prompts')">AI Prompts</div>
    <div class="cat-tab" onclick="filterCategory('UI/UX Kits')">UI Kits</div>
    <div class="cat-tab" onclick="filterCategory('Career Resources')">Career</div>
  </div>

  <div class="products" id="productList"></div>

  <div class="modal-overlay" id="checkoutModal">
    <div class="modal">
      <h2 id="modalTitle">Checkout</h2>
      <input type="email" id="buyerEmail" placeholder="Your email (for delivery)">
      <input type="text" id="buyerName" placeholder="Your name">
      <input type="text" id="buyerPhone" placeholder="Phone (optional)">
      <button class="btn-submit" id="payBtn" onclick="processCheckout()">Pay with Card (Paystack)</button>
      <button class="btn-close" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <div class="footer">
    Harz Digital Services • CAC RC: 321424<br>
    <a href="https://wa.me/2348028687857">WhatsApp Support</a> • 
    <a href="https://rabiuhamza11.github.io/harz-portfolio/harz-super-app.html">All Platforms</a>
  </div>

  <script>
    const API_URL = 'https://superagent-2286fb2f.base44.app/functions/harzPayments';
    let allProducts = [];
    let selectedProduct = null;
    let activeCategory = 'all';

    async function loadProducts() {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'batch_links', limit: 100 })
        });
        const data = await res.json();
        if (data.success) {
          allProducts = data.links || [];
          renderProducts();
          const mode = data.mode || 'TEST';
          if (mode === 'TEST') {
            const banner = document.querySelector('.pay-banner');
            banner.innerHTML = 'Bank Transfer & Crypto: <b>LIVE</b> • Card: <b>TEST MODE</b> — Paystack live keys needed';
            banner.style.background = '#44220a';
            banner.style.color = '#fbbf24';
          }
        }
      } catch(e) {
        document.getElementById('productList').innerHTML = '<p style="text-align:center;color:#666;padding:40px;">Loading products... If this persists, refresh.</p>';
      }
    }

    function renderProducts() {
      let filtered = allProducts;
      if (activeCategory !== 'all') {
        filtered = filtered.filter(p => p.category === activeCategory);
      }
      const search = document.getElementById('search').value.toLowerCase();
      if (search) {
        filtered = filtered.filter(p => p.title.toLowerCase().includes(search));
      }

      if (filtered.length === 0) {
        document.getElementById('productList').innerHTML = '<p style="text-align:center;color:#666;padding:40px;">No products found.</p>';
        return;
      }

      const html = filtered.map(p => `
        <div class="product" data-title="${p.title.toLowerCase()}" data-cat="${p.category}">
          <span class="cat-badge">${p.category}</span>
          <h3>${p.title}</h3>
          <div class="price">${p.currency} <span class="cur">${p.currency}</span> ${p.price.toLocaleString()}</div>
          <div class="pay-options">
            <button class="pay-btn btn-paystack" onclick="openCheckout('${p.product_id}','${p.title.replace(/'/g,"")}',${p.price},'${p.currency}')">Pay with Card</button>
            <button class="pay-btn btn-bank" onclick="toggleBank('${p.product_id}', ${p.price})">Bank Transfer</button>
            <button class="pay-btn btn-whatsapp" onclick="shareWhatsApp('${p.title.replace(/'/g,"")}','${p.price}','${p.currency}','${p.bank_transfer.reference}')">WhatsApp</button>
          </div>
          <div class="bank-info" id="bank-${p.product_id}">
            <div class="row"><span class="label">Bank</span><span class="val">UBA (United Bank for Africa)</span></div>
            <div class="row"><span class="label">Account Name</span><span class="val">Rabiu Hamza Mohammed</span></div>
            <div class="row"><span class="label">Account Number</span><span class="val">2034326424 <span class="copy" onclick="copyText('2034326424')">copy</span></span></div>
            <div class="row"><span class="label">Amount</span><span class="val">${p.currency} ${p.price.toLocaleString()}</span></div>
            <div class="row"><span class="label">Reference</span><span class="val">${p.bank_transfer.reference}</span></div>
            <div class="row"><span class="label">USSD</span><span class="val" style="font-size:11px">*737*033*2034326424*${p.price}#</span></div>
            <p style="margin-top:8px;color:#888;font-size:11px">After payment, send proof to WhatsApp 08028687857 for instant delivery.</p>
          </div>
        </div>
      `).join('');
      document.getElementById('productList').innerHTML = html;
    }

    function filterProducts() { renderProducts(); }
    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderProducts();
    }

    function toggleBank(id, price) {
      const el = document.getElementById('bank-' + id);
      el.classList.toggle('show');
    }

    function openCheckout(id, title, price, currency) {
      selectedProduct = { id, title, price, currency };
      document.getElementById('modalTitle').textContent = 'Pay for: ' + title;
      document.getElementById('checkoutModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('checkoutModal').classList.remove('show');
      selectedProduct = null;
    }

    async function processCheckout() {
      if (!selectedProduct) return;
      const email = document.getElementById('buyerEmail').value;
      const name = document.getElementById('buyerName').value;
      const phone = document.getElementById('buyerPhone').value;
      if (!email) { alert('Please enter your email'); return; }

      const btn = document.getElementById('payBtn');
      btn.innerHTML = '<span class="spinner"></span> Processing...';
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'paystack_checkout',
            product_id: selectedProduct.id,
            product_title: selectedProduct.title,
            amount: selectedProduct.price,
            currency: selectedProduct.currency,
            buyer_email: email,
            buyer_name: name,
            buyer_phone: phone
          })
        });
        const data = await res.json();
        if (data.success && data.checkout_url) {
          window.location.href = data.checkout_url;
        } else {
          alert('Payment error: ' + (data.error || 'Unknown'));
          btn.innerHTML = 'Pay with Card (Paystack)';
          btn.disabled = false;
        }
      } catch(e) {
        alert('Connection error. Try Bank Transfer instead.');
        btn.innerHTML = 'Pay with Card (Paystack)';
        btn.disabled = false;
      }
    }

    function shareWhatsApp(title, price, currency, ref) {
      const text = `Hello! I want to buy:\n\n*${title}*\nPrice: ${currency} ${price}\nReference: ${ref}\n\nI'm ready to pay. How do I get this product?`;
      window.open(`https://wa.me/2348028687857?text=${encodeURIComponent(text)}`, '_blank');
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      alert('Copied: ' + text);
    }

    loadProducts();
  </script>
</body>
</html>
