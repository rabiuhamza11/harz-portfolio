<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARZ Exam Grading — Danfodio Memorial</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--p1:#7c4dff;--p2:#5362f6;--p3:#00d4aa;--pass:#22c55e;--fail:#ef4444;--a:#22c55e;--b:#3b82f6;--c:#f59e0b;--d:#f97316;--f:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:70px}
.header{position:sticky;top:0;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;border-bottom:1px solid var(--border)}
.header h1{font-size:1.05rem;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.view-tabs{display:flex;gap:6px;padding:12px 16px 0}
.view-tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:.76rem;font-weight:600;background:var(--card);border:1px solid var(--border);cursor:pointer}
.view-tab.active{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent;color:#fff}
.stat-row{display:flex;gap:8px;padding:10px 16px}
.stat-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat-card .stat-num{font-size:1rem;font-weight:700}
.stat-card .stat-lbl{font-size:.56rem;color:var(--muted);text-transform:uppercase;margin-top:2px}
.section-title{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 16px 4px;font-weight:600}
.exam-list,.student-list{padding:0 16px}
.exam-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;transition:.2s}
.exam-card:active{transform:scale(.98)}
.exam-actions{display:flex;gap:6px;margin-top:8px}
.exam-btn{flex:1;padding:8px;border-radius:8px;font-size:.72rem;font-weight:600;border:none;cursor:pointer;text-align:center}
.exam-btn.grade{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.exam-btn.paper{background:rgba(0,212,170,.12);color:var(--p3);border:1px solid rgba(0,212,170,.3)}
.exam-btn.del{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.student-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:10px}
.student-card:active{transform:scale(.98)}
.exam-name{font-size:.88rem;font-weight:700;margin-bottom:4px}
.exam-meta{font-size:.68rem;color:var(--muted)}
.exam-class{display:inline-block;padding:2px 8px;border-radius:10px;background:rgba(124,77,255,.12);color:var(--p1);font-size:.62rem;font-weight:600;margin-top:4px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;flex-shrink:0}
.s-info{flex:1;min-width:0}
.s-name{font-size:.85rem;font-weight:600}
.s-meta{font-size:.68rem;color:var(--muted);margin-top:2px}
.grade-badge{padding:4px 12px;border-radius:10px;font-size:.82rem;font-weight:700;flex-shrink:0}
.grade-a{background:rgba(34,197,94,.15);color:var(--a)}
.grade-b{background:rgba(59,130,246,.15);color:var(--b)}
.grade-c{background:rgba(245,158,11,.15);color:var(--c)}
.grade-d{background:rgba(249,115,22,.15);color:var(--d)}
.grade-f{background:rgba(239,68,68,.15);color:var(--f)}
.subject-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:6px}
.subject-row .sr-name{flex:1;font-size:.82rem;font-weight:600}
.subject-row input{width:70px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;text-align:center;font-size:.85rem;font-weight:600}
.subject-row input:focus{outline:none;border-color:var(--p1)}
.student-grade-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:0 16px 12px}
.sgc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sgc-name{font-size:.92rem;font-weight:700}
.sgc-stats{display:flex;gap:8px;align-items:center}
.sgc-total{font-size:.78rem;color:var(--muted)}
.sgc-avg{font-size:1.1rem;font-weight:700}
.live-summary{display:flex;justify-content:space-around;padding:10px;background:var(--bg);border-radius:10px;margin-top:10px;border:1px solid var(--border)}
.live-summary .ls-item{text-align:center}
.live-summary .ls-val{font-size:1.1rem;font-weight:700}
.live-summary .ls-lbl{font-size:.58rem;color:var(--muted);text-transform:uppercase}
.report-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:0 16px 10px}
.rc-header{text-align:center;margin-bottom:14px}
.rc-header .rc-school{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.rc-header .rc-title{font-size:1rem;font-weight:700;margin:4px 0}
.rc-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;font-size:.75rem}
.rc-info .rc-lbl{color:var(--muted)}
.rc-info .rc-val{font-weight:600}
.result-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:.8rem}
.result-row:last-child{border:none}
.result-row .rr-subj{color:var(--muted)}
.result-row .rr-score{font-weight:600}
/* Exam Paper View */
.paper-header{text-align:center;padding:20px 16px;border-bottom:2px solid var(--border);margin-bottom:16px}
.paper-header .ph-school{font-size:1.1rem;font-weight:700}
.paper-header .ph-sub{font-size:.78rem;color:var(--muted);margin:4px 0}
.paper-header .ph-exam{font-size:.92rem;font-weight:600;background:linear-gradient(135deg,var(--p1),var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:8px}
.paper-info{display:flex;justify-content:space-around;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin:0 16px 16px;font-size:.72rem}
.paper-info .pi-item{text-align:center}
.paper-info .pi-lbl{color:var(--muted);font-size:.6rem;text-transform:uppercase}
.paper-info .pi-val{font-weight:600;margin-top:2px}
.paper-subject{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:0 16px 20px}
.paper-subject-title{font-size:.92rem;font-weight:700;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.paper-subject-title .pst-marks{font-size:.72rem;color:var(--p3)}
.paper-question{padding:10px 0;border-bottom:1px solid var(--border)}
.paper-question:last-child{border:none}
.pq-num{font-weight:700;font-size:.82rem;margin-bottom:4px}
.pq-text{font-size:.82rem;line-height:1.5;margin-bottom:6px}
.pq-options{display:flex;flex-direction:column;gap:4px;padding-left:16px}
.pq-option{font-size:.78rem;color:var(--muted);display:flex;gap:6px}
.pq-option .po-letter{font-weight:600;color:var(--text)}
.pq-answer-line{border-bottom:1px dashed var(--border);height:24px;margin:4px 0}
.print-btn{display:block;width:calc(100% - 32px);margin:16px auto;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:.88rem;font-weight:700;cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:1.1rem;margin-bottom:14px}
.form-group{margin-bottom:10px}
.form-label{font-size:.72rem;color:var(--muted);margin-bottom:4px;display:block}
.form-input,.form-select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-size:.85rem;font-family:inherit}
.form-input:focus{outline:none;border-color:var(--p1)}
.form-row{display:flex;gap:8px}
.form-row>*{flex:1}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:10px;font-size:.85rem;font-weight:600;border:none;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.btn-cancel{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.fab{position:fixed;bottom:16px;right:16px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p2));border:none;color:#fff;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 20px rgba(124,77,255,.4);z-index:90;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:20px;font-size:.78rem;z-index:400;opacity:0;transition:.3s}
.toast.show{opacity:1;bottom:90px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .emoji{font-size:2.5rem;margin-bottom:8px}
.back-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:.72rem;cursor:pointer}
.auto-btn{background:rgba(0,212,170,.12);color:var(--p3);border:1px solid rgba(0,212,170,.3);padding:8px 14px;border-radius:10px;font-size:.78rem;font-weight:600;cursor:pointer}
.subj-checkbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.subj-chip{font-size:.75rem;cursor:pointer;background:var(--card);padding:6px 10px;border-radius:8px;border:1px solid var(--border);display:inline-flex;align-items:center;gap:4px;transition:.2s}
.subj-chip.checked{background:rgba(124,77,255,.12);border-color:var(--p1);color:var(--p1)}
@media print{body{background:#fff;color:#000}body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;left:0;top:0;width:100%}.no-print{display:none}}
</style>
</head>
<body>
<div class="header"><h1>🎓 HARZ Exam Grading</h1><button class="back-btn" id="backBtn" style="display:none" onclick="goBack()">‹ Back</button></div>
<div class="view-tabs">
<div class="view-tab active" onclick="switchView('exams')" id="tabExams">Exams</div>
<div class="view-tab" onclick="switchView('students')" id="tabStudents">Students</div>
<div class="view-tab" onclick="switchView('reports')" id="tabReports">Reports</div>
</div>
<div id="examsView">
<div class="stat-row">
<div class="stat-card"><div class="stat-num" id="stExams">0</div><div class="stat-lbl">Exams</div></div>
<div class="stat-card"><div class="stat-num" id="stStudents">0</div><div class="stat-lbl">Students</div></div>
<div class="stat-card"><div class="stat-num" id="stAvg" style="color:var(--p3)">--</div><div class="stat-lbl">Avg Score</div></div>
<div class="stat-card"><div class="stat-num" id="stPass" style="color:var(--pass)">0%</div><div class="stat-lbl">Pass Rate</div></div>
</div>
<div class="section-title">Exams — Tap to View Paper or Grade</div>
<div class="exam-list" id="examList"></div>
</div>
<div id="studentsView" style="display:none">
<div class="section-title">Students — Tap to Edit</div>
<div class="student-list" id="studentList"></div>
</div>
<div id="reportsView" style="display:none">
<div class="section-title">Auto-Generated Report Cards</div>
<div id="reportList" style="padding:0 16px"></div>
</div>
<div id="gradeView" style="display:none"></div>
<div id="paperView" style="display:none"></div>
<button class="fab" onclick="openModal()" id="fabBtn">+</button>
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h2 id="modalTitle">Add Exam</h2>
<div id="modalContent"></div>
</div>
</div>
<div class="toast" id="toast"></div>

// Fallback generic questions for any subject not in the bank
function generateGenericQuestions(subject,level){
var levelName=level==='senior'?'Senior Secondary':level==='junior'?'Junior Secondary':'Primary';
return [
{type:'mcq',q:'What is the main focus of '+subject+'?',options:['Nothing specific','Understanding key concepts','Memorizing only','Guessing'],answer:1},

{type:'short',q:'Define three key terms related to '+subject+'.'},

{type:'short',q:'List five things you have learned in '+subject+' this term.'},

{type:'short',q:'Discuss how '+subject+' can help you in your future career.'}
];
}

function getLevelForClass(cls){
if(cls.startsWith('Pry')||cls==='Nursery')return'primary';
if(cls.startsWith('JSS'))return'junior';
if(cls.startsWith('SSS'))return'senior';
return'primary';
}

function generateQuestions(subject,cls){
var level=getLevelForClass(cls);
if(questionBank[subject]&&questionBank[subject][level]){
return questionBank[subject][level];
}
return generateGenericQuestions(subject,level);
}

{id:'e2',name:'First Term Exam',class:'Pry 5',term:'First Term',date:today,subjects:pry5Subjects,grades:pry5Grades,paper:pry5Paper,totalMarks:pry5Subjects.length*100}
];
saveAll();
}

function render(){
document.getElementById('stExams').textContent=exams.length;
document.getElementById('stStudents').textContent=students.length;
if(currentView==='exams')renderExams();
else if(currentView==='students')renderStudents();
else if(currentView==='reports')renderReports();
}

function renderExams(){
var list=document.getElementById('examList');
var allPcts=[];
exams.forEach(function(e){Object.values(e.grades||{}).forEach(function(s){var vals=Object.values(s);if(vals.length>0)allPcts.push(vals.reduce(function(a,b){return a+b},0)/vals.length)})});
var avgScore=allPcts.length?Math.round(allPcts.reduce(function(a,b){return a+b},0)/allPcts.length):0;
var passRate=allPcts.length?Math.round(allPcts.filter(function(p){return p>=50}).length/allPcts.length*100):0;
document.getElementById('stAvg').textContent=avgScore>0?avgScore+'%':'--';
document.getElementById('stPass').textContent=passRate+'%';
if(exams.length===0){list.innerHTML='<div class="empty"><div class="emoji">🎓</div><p>No exams yet. Tap + to create one.</p></div>';return}
list.innerHTML=exams.map(function(e){
var gradedCount=Object.keys(e.grades||{}).length;
var qCount=0;
if(e.paper){Object.values(e.paper).forEach(function(qs){qCount+=qs.length})}
return '<div class="exam-card">'+
'<div class="exam-name">'+esc(e.name)+'</div>'+
'<div class="exam-meta">'+esc(e.term)+' · '+e.subjects.length+' subjects · '+qCount+' questions · '+gradedCount+' graded</div>'+
'<div class="exam-class">'+e.class+'</div>'+
'<div class="exam-actions">'+
'<button class="exam-btn paper" onclick="viewPaper(\''+e.id+'\')">📄 View Exam Paper</button>'+
'<button class="exam-btn grade" onclick="gradeExam(\''+e.id+'\')">✏️ Grade Students</button>'+
'<button class="exam-btn del" onclick="delExam(\''+e.id+'\')">🗑</button>'+
'</div></div>';
}).join('');
}

function viewPaper(examId){
var exam=exams.find(function(e){return e.id===examId});
if(!exam)return;
document.getElementById('examsView').style.display='none';
document.getElementById('paperView').style.display='block';
document.getElementById('backBtn').style.display='block';
document.getElementById('fabBtn').style.display='none';

var html='<div class="print-area">';
html+='<div class="paper-header no-print" style="border:none">';
html+='<button class="back-btn" style="margin-bottom:8px" onclick="goBack()">‹ Back</button>';
html+='</div>';
// Exam paper header
html+='<div class="paper-header">';
html+='<div class="ph-school">DANFODIO MEMORIAL ACADEMY</div>';
html+='<div class="ph-sub">'+exam.class+' · '+esc(exam.term)+' · '+new Date(exam.date).toLocaleDateString('en-NG',{year:'numeric',month:'long',day:'numeric'})+'</div>';
html+='<div class="ph-exam">'+esc(exam.name).toUpperCase()+'</div>';
html+='</div>';

// Info row
var totalQ=0;
if(exam.paper)Object.values(exam.paper).forEach(function(qs){totalQ+=qs.length});
html+='<div class="paper-info no-print">';
html+='<div class="pi-item"><div class="pi-lbl">Subjects</div><div class="pi-val">'+exam.subjects.length+'</div></div>';
html+='<div class="pi-item"><div class="pi-lbl">Questions</div><div class="pi-val">'+totalQ+'</div></div>';
html+='<div class="pi-item"><div class="pi-lbl">Total Marks</div><div class="pi-val">'+(exam.subjects.length*100)+'</div></div>';
html+='<div class="pi-item"><div class="pi-lbl">Duration</div><div class="pi-val">2 Hours</div></div>';
html+='</div>';

// Print button
html+='<button class="print-btn no-print" onclick="window.print()">🖨️ Print / Save as PDF</button>';

// Each subject
exam.subjects.forEach(function(subj,idx){
var questions=exam.paper&&exam.paper[subj]?exam.paper[subj]:generateQuestions(subj,exam.class);
var mcqCount=questions.filter(function(q){return q.type==='mcq'}).length;
var shortCount=questions.filter(function(q){return q.type==='short'}).length;
html+='<div class="paper-subject">';
html+='<div class="paper-subject-title">SECTION '+(idx+1)+': '+subj+' <span class="pst-marks">100 Marks ('+mcqCount+' MCQ + '+shortCount+' Theory)</span></div>';
html+='<div style="font-size:.72rem;color:var(--muted);margin-bottom:10px">Answer all questions in this section.</div>';
questions.forEach(function(q,qi){
html+='<div class="paper-question">';
html+='<div class="pq-num">Q'+(qi+1)+'. '+(q.type==='mcq'?'(MCQ)':'(Theory)')+'</div>';
html+='<div class="pq-text">'+esc(q.q)+'</div>';
if(q.type==='mcq'&&q.options){
html+='<div class="pq-options">';
q.options.forEach(function(opt,oi){
var letter=String.fromCharCode(65+oi);
html+='<div class="pq-option"><span class="po-letter">'+letter+'.</span> '+esc(opt)+'</div>';
});
html+='</div>';
}else{
// Answer lines for short questions
html+='<div class="pq-answer-line"></div>';
html+='<div class="pq-answer-line"></div>';
html+='<div class="pq-answer-line"></div>';
}
html+='</div>';
});
html+='</div>';
});

html+='</div>'; // close print-area
document.getElementById('paperView').innerHTML=html;
}

function delExam(examId){
if(!confirm('Delete this exam and all its grades?'))return;
exams=exams.filter(function(e){return e.id!==examId});
saveAll();render();showToast('Exam deleted');
}

function renderStudents(){
var list=document.getElementById('studentList');
if(students.length===0){list.innerHTML='<div class="empty"><div class="emoji">👨‍🎓</div><p>No students. Tap + to add.</p></div>';return}
list.innerHTML=students.map(function(s){
var stExams=exams.filter(function(e){return e.class===s.class&&e.grades&&e.grades[s.id]});
var avg='--',gr={g:'--',c:'grade-d'};
if(stExams.length>0){
var exam=stExams[0];
var vals=Object.values(exam.grades[s.id]);
if(vals.length>0){avg=Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length)+'%';gr=gradeFor(parseInt(avg))}
}
return '<div class="student-card" onclick="editStudent(\''+s.id+'\')">'+
'<div class="avatar" style="background:rgba(124,77,255,.12);color:var(--p1)">'+initials(s.name)+'</div>'+
'<div class="s-info"><div class="s-name">'+esc(s.name)+'</div><div class="s-meta">'+s.class+'</div></div>'+
'<div class="grade-badge '+gr.c+'">'+gr.g+' '+avg+'</div></div>';
}).join('');
}

function renderReports(){
var list=document.getElementById('reportList');
if(students.length===0){list.innerHTML='<div class="empty"><div class="emoji">📋</div><p>No students.</p></div>';return}
var html='';
students.forEach(function(s){
var stExams=exams.filter(function(e){return e.class===s.class&&e.grades&&e.grades[s.id]});
if(stExams.length===0)return;
stExams.forEach(function(exam){
var grades=exam.grades[s.id];
var scores=Object.entries(grades);
if(scores.length===0)return;
var total=scores.reduce(function(a,p){return a+p[1]},0);
var avg=Math.round(total/scores.length);
var gr=gradeFor(avg);
html+='<div class="report-card">'+
'<div class="rc-header"><div class="rc-school">Danfodio Memorial Academy</div><div class="rc-title">Term Report Card</div></div>'+
'<div class="rc-info">'+
'<div><span class="rc-lbl">Name:</span> <span class="rc-val">'+esc(s.name)+'</span></div>'+
'<div><span class="rc-lbl">Class:</span> <span class="rc-val">'+s.class+'</span></div>'+
'<div><span class="rc-lbl">Term:</span> <span class="rc-val">'+esc(exam.term)+'</span></div>'+
'<div><span class="rc-lbl">Exam:</span> <span class="rc-val">'+esc(exam.name)+'</span></div></div>'+
scores.map(function(p){var subj=p[0],score=p[1];var sg=gradeFor(score);return '<div class="result-row"><span class="rr-subj">'+subj+'</span><span><span class="rr-score">'+score+'/100</span> <span class="grade-badge '+sg.c+'" style="padding:2px 6px;font-size:.62rem">'+sg.g+'</span></span></div>'}).join('')+
'<div style="border-top:2px solid var(--border);margin-top:8px;padding-top:8px">'+
'<div class="result-row"><span class="rr-subj" style="font-weight:600">Total</span><span class="rr-score" style="font-size:1rem">'+total+' / '+(scores.length*100)+'</span></div>'+
'<div class="result-row"><span class="rr-subj" style="font-weight:600">Average</span><span class="rr-score" style="font-size:1.1rem;color:var(--p3)">'+avg+'%</span></div>'+
'<div class="result-row"><span class="rr-subj" style="font-weight:600">Grade</span><span class="grade-badge '+gr.c+'" style="font-size:1rem">'+gr.g+'</span></div>'+
'<div class="result-row"><span class="rr-subj" style="font-weight:600">Position</span><span class="rr-score">'+getStudentPosition(exam,s.id)+'</span></div></div></div>';
});
});
list.innerHTML=html||'<div class="empty"><div class="emoji">📋</div><p>No graded students yet. Grade an exam first.</p></div>';
}

function getStudentPosition(exam,studentId){
var classStudents=students.filter(function(s){return s.class===exam.class&&exam.grades[s.id]});
var avgs=classStudents.map(function(s){var vals=Object.values(exam.grades[s.id]);return vals.length>0?vals.reduce(function(a,b){return a+b},0)/vals.length:0});
avgs.sort(function(a,b){return b-a});
var studentAvg=Object.values(exam.grades[studentId]).reduce(function(a,b){return a+b},0)/Object.values(exam.grades[studentId]).length;
var pos=avgs.indexOf(studentAvg)+1;
var suffix=pos===1?'st':pos===2?'nd':pos===3?'rd':'th';
return pos+'/'+avgs.length+' ('+pos+suffix+')';
}

function gradeExam(id){
gradeExamId=id;
var exam=exams.find(function(e){return e.id===id});
if(!exam)return;
document.getElementById('examsView').style.display='none';
document.getElementById('gradeView').style.display='block';
document.getElementById('paperView').style.display='none';
document.getElementById('backBtn').style.display='block';
document.getElementById('fabBtn').style.display='none';
var classStudents=students.filter(function(s){return s.class===exam.class});
var subjList=exam.subjects;
if(classStudents.length===0){document.getElementById('gradeView').innerHTML='<div class="section-title">Grade: '+esc(exam.name)+' — '+exam.class+'</div><div class="empty"><div class="emoji">⚠️</div><p>No students in '+exam.class+'. Add students first.</p></div>';return}
classStudents.forEach(function(s){if(!exam.grades[s.id]){exam.grades[s.id]={};subjList.forEach(function(sub){exam.grades[s.id][sub]=0})}});
saveAll();
var html='<div class="section-title">Grade: '+esc(exam.name)+' — '+exam.class+'</div>';
html+='<div style="padding:0 16px;margin-bottom:10px;display:flex;gap:8px">';
html+='<button class="auto-btn" onclick="autoGenerateGrades(\''+exam.id+'\')">⚡ Auto-Generate All Grades</button>';
html+='<button class="auto-btn" onclick="clearAllGrades(\''+exam.id+'\')" style="color:var(--fail);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)">🗑 Clear All</button>';
html+='</div>';
classStudents.forEach(function(s){
var existing=exam.grades[s.id]||{};
var vals=Object.values(existing);
var total=vals.reduce(function(a,b){return a+b},0);
var avg=vals.length>0?Math.round(total/vals.length):0;
var gr=avg>0?gradeFor(avg):{g:'-',c:'grade-f'};
html+='<div class="student-grade-card"><div class="sgc-header"><div class="sgc-name">'+esc(s.name)+'</div><div class="sgc-stats"><span class="sgc-total">Total: '+total+'</span><span class="sgc-avg" style="color:var(--p3)">'+avg+'%</span><span class="grade-badge '+gr.c+'">'+gr.g+'</span></div></div>';
subjList.forEach(function(sub){
var score=existing[sub]||0;
html+='<div class="subject-row"><span class="sr-name">'+sub+'</span><input type="number" min="0" max="100" value="'+score+'" placeholder="0" oninput="updateGradeLive(\''+exam.id+'\',\''+s.id+'\',\''+sub+'\',this.value,this)"></div>';
});
html+='<div class="live-summary" id="summary-'+s.id+'"><div class="ls-item"><div class="ls-val">'+total+'</div><div class="ls-lbl">Total</div></div><div class="ls-item"><div class="ls-val" style="color:var(--p3)">'+avg+'%</div><div class="ls-lbl">Average</div></div><div class="ls-item"><div class="ls-val"><span class="grade-badge '+gr.c+'">'+gr.g+'</span></div><div class="ls-lbl">Grade</div></div></div></div>';
});
document.getElementById('gradeView').innerHTML=html;
}

function updateGradeLive(examId,studentId,subject,scoreVal,inputEl){
var exam=exams.find(function(e){return e.id===examId});
if(!exam)return;
if(!exam.grades[studentId])exam.grades[studentId]={};
exam.grades[studentId][subject]=parseInt(scoreVal)||0;
saveAll();
var vals=Object.values(exam.grades[studentId]);
var total=vals.reduce(function(a,b){return a+b},0);
var avg=vals.length>0?Math.round(total/vals.length):0;
var gr=avg>0?gradeFor(avg):{g:'-',c:'grade-f'};
var summary=document.getElementById('summary-'+studentId);
if(summary)summary.innerHTML='<div class="ls-item"><div class="ls-val">'+total+'</div><div class="ls-lbl">Total</div></div><div class="ls-item"><div class="ls-val" style="color:var(--p3)">'+avg+'%</div><div class="ls-lbl">Average</div></div><div class="ls-item"><div class="ls-val"><span class="grade-badge '+gr.c+'">'+gr.g+'</span></div><div class="ls-lbl">Grade</div></div>';
var card=inputEl.closest('.student-grade-card');
if(card){var header=card.querySelector('.sgc-stats');if(header)header.innerHTML='<span class="sgc-total">Total: '+total+'</span><span class="sgc-avg" style="color:var(--p3)">'+avg+'%</span><span class="grade-badge '+gr.c+'">'+gr.g+'</span>'}
}

function autoGenerateGrades(examId){
var exam=exams.find(function(e){return e.id===examId});
if(!exam)return;
var classStudents=students.filter(function(s){return s.class===exam.class});
classStudents.forEach(function(s){if(!exam.grades[s.id])exam.grades[s.id]={};exam.subjects.forEach(function(sub){exam.grades[s.id][sub]=Math.floor(Math.random()*50)+45})});
saveAll();gradeExam(examId);showToast('Grades auto-generated ✓');
}

function clearAllGrades(examId){
var exam=exams.find(function(e){return e.id===examId});
if(!exam)return;
if(!confirm('Clear all grades?'))return;
var classStudents=students.filter(function(s){return s.class===exam.class});
classStudents.forEach(function(s){exam.grades[s.id]={};exam.subjects.forEach(function(sub){exam.grades[s.id][sub]=0})});
saveAll();gradeExam(examId);showToast('All grades cleared');
}

function goBack(){
gradeExamId=null;
document.getElementById('gradeView').style.display='none';
document.getElementById('paperView').style.display='none';
document.getElementById('backBtn').style.display='none';
document.getElementById('fabBtn').style.display='flex';
switchView(currentView);
}

function switchView(v){
currentView=v;
document.getElementById('gradeView').style.display='none';
document.getElementById('paperView').style.display='none';
document.getElementById('fabBtn').style.display='flex';
['Exams','Students','Reports'].forEach(function(t){document.getElementById('tab'+t).classList.toggle('active',t.toLowerCase()===v)});
document.getElementById('examsView').style.display=v==='exams'?'block':'none';
document.getElementById('studentsView').style.display=v==='students'?'block':'none';
document.getElementById('reportsView').style.display=v==='reports'?'block':'none';
if(v==='reports')document.getElementById('fabBtn').style.display='none';
render();
}

function openModal(){
var modalContent=document.getElementById('modalContent');
if(currentView==='exams'||currentView==='reports'){
document.getElementById('modalTitle').textContent='Create Exam — Auto-Generates Questions';
var subjChips=subjects.map(function(s){return '<label class="subj-chip checked" onclick="this.classList.toggle(\'checked\')"><input type="checkbox" value="'+s+'" checked style="display:none">'+s+'</label>'}).join('');
modalContent.innerHTML='<div class="form-group"><label class="form-label">Exam Name</label><input class="form-input" id="exName" placeholder="e.g. First Term Exam" value="First Term Exam"></div>'+
'<div class="form-row"><div class="form-group"><label class="form-label">Class</label><select class="form-select" id="exClass">'+classOptions.map(function(c){return '<option value="'+c+'">'+c+'</option>'}).join('')+'</select></div>'+
'<div class="form-group"><label class="form-label">Term</label><select class="form-select" id="exTerm"><option>First Term</option><option>Second Term</option><option>Third Term</option></select></div></div>'+
'<div class="form-group"><label class="form-label">Subjects (tap to select/deselect)</label><div class="subj-checkbox">'+subjChips+'</div></div>'+
'<div style="background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.2);border-radius:10px;padding:10px;margin:10px 0;font-size:.72rem;color:var(--p3)">⚡ Exam paper with questions (MCQ + Theory) will be auto-generated for each subject based on the class level.</div>'+
'<div class="modal-actions"><button class="btn btn-cancel" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveExam()">Create Exam Paper</button></div>';
}else{
document.getElementById('modalTitle').textContent='Add Student';
modalContent.innerHTML='<div class="form-group"><label class="form-label">Student Name</label><input class="form-input" id="stName" placeholder="Full name"></div>'+
'<div class="form-group"><label class="form-label">Class</label><select class="form-select" id="stClass">'+classOptions.map(function(c){return '<option value="'+c+'">'+c+'</option>'}).join('')+'</select></div>'+
'<div class="modal-actions"><button class="btn btn-cancel" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStudent()">Save</button></div>';
}
document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

function saveExam(){
var name=document.getElementById('exName').value.trim();
if(!name){showToast('Enter exam name');return}
var cls=document.getElementById('exClass').value;
var term=document.getElementById('exTerm').value;
var selectedSubs=[];
document.querySelectorAll('.subj-chip.checked input').forEach(function(c){selectedSubs.push(c.value)});
if(selectedSubs.length===0){showToast('Select at least one subject');return}

// AUTO-GENERATE EXAM PAPER with questions for each subject
var paper={};
var totalQ=0;
selectedSubs.forEach(function(sub){
paper[sub]=generateQuestions(sub,cls);
totalQ+=paper[sub].length;
});

// Auto-populate students
var classStudents=students.filter(function(s){return s.class===cls});
var autoGrades={};
classStudents.forEach(function(s){autoGrades[s.id]={};selectedSubs.forEach(function(sub){autoGrades[s.id][sub]=0})});

exams.push({id:Math.random().toString(36).substr(2,9),name:name,class:cls,term:term,date:new Date().toISOString().split('T')[0],subjects:selectedSubs,grades:autoGrades,paper:paper,totalMarks:selectedSubs.length*100});
saveAll();closeModal();render();
showToast('Exam created — '+totalQ+' questions auto-generated ✓');

// Auto-open the paper view
setTimeout(function(){viewPaper(exams[exams.length-1].id)},500);
}

function saveStudent(){
var name=document.getElementById('stName').value.trim();
if(!name){showToast('Enter name');return}
var cls=document.getElementById('stClass').value;
var newId=Math.random().toString(36).substr(2,9);
students.push({id:newId,name:name,class:cls});
exams.forEach(function(e){if(e.class===cls&&!e.grades[newId]){e.grades[newId]={};e.subjects.forEach(function(sub){e.grades[newId][sub]=0})}});
saveAll();closeModal();render();showToast('Student added ✓');
}

function editStudent(id){showToast('Tap an exam to grade this student')}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

load();seed();render();
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target.id==='modalOverlay')closeModal()});
</script>
