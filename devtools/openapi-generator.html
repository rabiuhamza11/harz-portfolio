<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OpenAPI Spec Generator — HARZ DevTools</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;max-width:900px;margin:0 auto;padding:20px;background:#0d1117;color:#e6edf3}h1{color:#58a6ff;font-size:1.4em}label{display:block;color:#8b949e;font-size:0.85em;margin:3px 0}input,select,textarea{width:100%;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px;font-size:0.9em}button{padding:10px 20px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:10px 5px 0 0}.field{margin:10px 0}.row{display:flex;gap:10px}.row>div{flex:1}pre{background:#161b22;padding:15px;border-radius:6px;overflow-x:auto;white-space:pre-wrap;font-size:0.85em;border:1px solid #30363d;margin-top:10px;max-height:500px;overflow-y:auto}</style></head>
<body><h1>OpenAPI 3.0 Spec Generator</h1>
<div class="row"><div class="field"><label>API Title</label><input id="title" value="HARZ Cloud API" oninput="gen()"></div>
<div class="field"><label>Version</label><input id="ver" value="1.0.0" oninput="gen()"></div></div>
<div class="field"><label>Base URL</label><input id="url" value="https://harz-cloud-api.harz.workers.dev" oninput="gen()"></div>
<div class="field"><label>Routes (one per line: METHOD /path | description)</label>
<textarea id="routes" rows="8" oninput="gen()">GET /health | Health check
GET /products | List all products
POST /products | Create a product
GET /products/{id} | Get product by ID
PUT /products/{id} | Update product
DELETE /products/{id} | Delete product
POST /chat | AI chat message
GET /payments/balance | Check payment balance</textarea></div>
<button onclick="download()">Download openapi.json</button>
<button onclick="copy()">Copy JSON</button>
<pre id="output"></pre>
<script>
function gen(){
const lines=document.getElementById('routes').value.split('\n').filter(l=>l.trim());
const paths={};
lines.forEach(l=>{const[m,d]=l.split('|').map(s=>s.trim());const[method,path]=m.split(' ');const m2=method.toLowerCase();
if(!paths[path])paths[path]={};
paths[path][m2]={summary:d,responses:{"200":{description:"OK","content":{"application/json":{schema:{type:"object"}}}}}};
if(m2==='post'||m2==='put'){paths[path][m2].requestBody={content:{"application/json":{schema:{type:"object"}}}};}});
const spec={openapi:"3.0.3",info:{title:document.getElementById('title').value,version:document.getElementById('ver').value,description:"Generated by HARZ DevTools"},servers:[{url:document.getElementById('url').value}],paths:paths,components:{securitySchemes:{bearerAuth:{type:"http",scheme:"bearer"}}}};
document.getElementById('output').textContent=JSON.stringify(spec,null,2);
}
function download(){const b=new Blob([document.getElementById('output').textContent],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='openapi.json';a.click();}
function copy(){navigator.clipboard.writeText(document.getElementById('output').textContent);alert('Copied!');}
gen();
</script></body></html>
