<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SSH Key Generator — HARZ DevTools</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;max-width:800px;margin:0 auto;padding:20px;background:#0d1117;color:#e6edf3}h1{color:#58a6ff;font-size:1.4em}label{display:block;color:#8b949e;font-size:0.85em;margin:3px 0}input{width:100%;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px}button{padding:10px 20px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:10px 5px 0 0}.field{margin:10px 0}pre{background:#161b22;padding:15px;border-radius:6px;font-size:0.85em;border:1px solid #30363d;margin-top:10px;word-break:break-all}.note{color:#f0883e;font-size:0.85em;margin:10px 0}</style></head>
<body><h1>SSH Key Generator</h1>
<div class="field"><label>Comment (email or name)</label><input id="comment" value="rabiu@harzdm.com" oninput=""></div>
<div class="field"><label>Key Size</label><select id="size" style="width:100%;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px"><option value="2048">RSA 2048</option><option value="4096">RSA 4096</option></select></div>
<button onclick="generate()">Generate Key Pair</button>
<div class="note">Note: Browser-based RSA key generation. For Ed25519 or production use, run: ssh-keygen -t ed25519 -C "email"</div>
<pre id="public"></pre>
<pre id="private"></pre>
<script>
async function generate(){
document.getElementById('public').textContent='Generating...';
const kp=await crypto.subtle.generateKey({name:'RSASSA-PKCS1-v1_5',modulusLength:parseInt(document.getElementById('size').value),publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['sign','verify']);
const pub=await crypto.subtle.exportKey('spki',kp.publicKey);
const priv=await crypto.subtle.exportKey('pkcs8',kp.privateKey);
const pubB64=btoa(String.fromCharCode(...new Uint8Array(pub)));
const privB64=btoa(String.fromCharCode(...new Uint8Array(priv)));
const comment=document.getElementById('comment').value;
document.getElementById('public').textContent=`ssh-rsa ${pubB64} ${comment}`;
document.getElementById('private').textContent=`-----BEGIN PRIVATE KEY-----\n${privB64.match(/.{1,64}/g).join('\n')}\n-----END PRIVATE KEY-----`;
}
</script></body></html>
