<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Postman Collection Generator — HARZ DevTools</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;max-width:800px;margin:0 auto;padding:20px;background:#0d1117;color:#e6edf3}h1{color:#58a6ff;font-size:1.4em}label{display:block;color:#8b949e;font-size:0.85em;margin:3px 0}input,textarea{width:100%;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px}button{padding:10px 20px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:10px 5px 0 0}pre{background:#161b22;padding:15px;border-radius:6px;overflow-x:auto;white-space:pre-wrap;font-size:0.85em;border:1px solid #30363d;margin-top:10px;max-height:500px;overflow-y:auto}.field{margin:10px 0}</style></head>
<body><h1>Postman Collection Generator</h1>
<div class="field"><label>Collection Name</label><input id="name" value="HARZ Cloud API" oninput="gen()"></div>
<div class="field"><label>Base URL</label><input id="url" value="https://harz-cloud-api.harz.workers.dev" oninput="gen()"></div>
<div class="field"><label>Routes (one per line: METHOD /path)</label>
<textarea id="routes" rows="6" oninput="gen()">GET /health
GET /products
POST /chat
POST /payments/checkout
GET /payments/balance
GET /agents</textarea></div>
<button onclick="download()">Download collection.json</button>
<button onclick="copy()">Copy JSON</button>
<pre id="output"></pre>
<script>
function gen(){
const lines=document.getElementById('routes').value.split('\n').filter(l=>l.trim());
const items=lines.map(l=>{const[m,p]=l.trim().split(' ');return{name:`${m} ${p}`,request:{method:m,header:[{key:"Content-Type",value:"application/json"}],url:`{{baseUrl}}${p}`},response:[]};});
const col={info:{name:document.getElementById('name').value,schema:"https://schema.getpostman.com/json/collection/v2.1.0/collection.json"},variable:[{key:"baseUrl",value:document.getElementById('url').value}],item:items};
document.getElementById('output').textContent=JSON.stringify(col,null,2);
}
function download(){const b=new Blob([document.getElementById('output').textContent],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='postman-collection.json';a.click();}
function copy(){navigator.clipboard.writeText(document.getElementById('output').textContent);alert('Copied!');}
gen();
</script></body></html>
