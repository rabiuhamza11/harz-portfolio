<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Markdown to PDF — HARZ DevTools</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;max-width:800px;margin:0 auto;padding:20px;background:#0d1117;color:#e6edf3}h1{color:#58a6ff;font-size:1.4em}label{display:block;color:#8b949e;font-size:0.85em;margin:3px 0}textarea{width:100%;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px;font-family:monospace}button{padding:10px 20px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:10px 5px 0 0}.field{margin:10px 0}iframe{width:100%;height:400px;border:1px solid #30363d;border-radius:6px;margin-top:10px}</style></head>
<body><h1>Markdown to PDF Converter</h1>
<div class="field"><label>Markdown content</label><textarea id="md" rows="10"># HARZ Digital Services Report

## Executive Summary
HARZ Cloud operates 63+ platforms on Cloudflare infrastructure.

## Key Metrics
- **Platforms:** 63+
- **Products:** 486
- **AI Agents:** 9
- **Workers:** 50+

## Revenue Breakdown
| Source | Amount |
|--------|--------|
| Gumroad | $15.00 |
| Paystack | ₦0 |
| USDT | $0 |

## Conclusion
The ecosystem is positioned for growth with zero-dependency infrastructure.

---
*Generated by HARZ DevTools*</textarea></div>
<button onclick="convert()">Convert & Print</button>
<div id="preview"></div>
<script>
function md2html(md){
let h=md.replace(/^### (.*$)/gim,'<h3>$1</h3>');
h=h.replace(/^## (.*$)/gim,'<h2>$1</h2>');
h=h.replace(/^# (.*$)/gim,'<h1>$1</h1>');
h=h.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
h=h.replace(/\*(.*?)\*/g,'<em>$1</em>');
h=h.replace(/`(.*?)`/g,'<code>$1</code>');
h=h.replace(/^- (.*)$/gim,'<li>$1</li>');
h=h.replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');
h=h.replace(/\[(.*?)\]\((.*?)\)/g,'<a href="$2">$1</a>');
h=h.replace(/---/g,'<hr>');
// Tables
h=h.replace(/^\|(.*)\|$/gim,(m,c1)=>`<tr>${c1.split('|').map(c=>`<td>${c.trim()}</td>`).join('')}</tr>`);
h=h.replace(/(<tr>.*<\/tr>\n?)+/g,m=>'<table style="width:100%;border-collapse:collapse">'+m.replace(/<tr>/,'<tr style="border-bottom:1px solid #ddd">')+'</table>');
h=h.replace(/\n\n/g,'<br><br>');
return h;
}
function convert(){
const md=document.getElementById('md').value;const html=md2html(md);
const styled=`<!DOCTYPE html><html><head><style>body{font-family:Arial;padding:40px;max-width:800px}h1{color:#1f6feb}h2{color:#333}table{border-collapse:collapse}td,th{padding:8px;border:1px solid #ddd}a{color:#1f6feb}code{background:#f0f0f0;padding:2px 6px;border-radius:3px}hr{border:none;border-top:2px solid #ddd;margin:20px 0}@page{size:A4;margin:1in}</style></head><body>${html}</body></html>`;
document.getElementById('preview').innerHTML=`<iframe srcdoc="${styled.replace(/"/g,'&quot;')}"></iframe>`;
const w=window.open('','_blank');w.document.write(styled+'<script>window.onload=()=>window.print()<\/script>');w.document.close();
}
</script></body></html>
