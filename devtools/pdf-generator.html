<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PDF Generator — HARZ DevTools</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;max-width:800px;margin:0 auto;padding:20px;background:#0d1117;color:#e6edf3}h1{color:#58a6ff;font-size:1.4em}label{display:block;color:#8b949e;font-size:0.85em;margin:3px 0}textarea,input{width:100%;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px}button{padding:10px 20px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:10px 5px 0 0}.field{margin:10px 0}.row{display:flex;gap:10px}.row>div{flex:1}iframe{width:100%;height:400px;border:1px solid #30363d;border-radius:6px;margin-top:10px}</style></head>
<body><h1>HTML to PDF Generator</h1>
<div class="row"><div class="field"><label>Title</label><input id="title" value="HARZ Invoice" oninput="gen()"></div>
<div class="field"><label>Page Size</label><select id="size" onchange="gen()" style="width:100%;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px"><option>A4</option><option>Letter</option><option>Legal</option></select></div></div>
<div class="field"><label>HTML Content</label><textarea id="html" rows="8" oninput="gen()"><h1 style="text-align:center;color:#1f6feb">HARZ Digital Services</h1>
<h2 style="text-align:center">Invoice #001</h2>
<p><strong>From:</strong> HARZ Digital Services, CAC RC: 321424</p>
<p><strong>To:</strong> Customer Name</p>
<table style="width:100%;border-collapse:collapse;margin-top:20px">
<tr style="background:#1f6feb;color:white"><th style="padding:8px">Item</th><th style="padding:8px">Amount</th></tr>
<tr><td style="padding:8px;border:1px solid #ddd">Digital Marketing Guide</td><td style="padding:8px;border:1px solid #ddd">₦3,000</td></tr>
<tr><td style="padding:8px;border:1px solid #ddd">Python Programming Course</td><td style="padding:8px;border:1px solid #ddd">₦2,500</td></tr>
<tr style="font-weight:bold"><td style="padding:8px;border:1px solid #ddd">Total</td><td style="padding:8px;border:1px solid #ddd">₦5,500</td></tr>
</table>
<p style="margin-top:20px;color:#666">Pay to: UBA 2034326424 (Rabiu Hamza Mohammed)</p></textarea></div>
<button onclick="print()">Print / Save as PDF</button>
<div id="preview-wrap" style="margin-top:15px"></div>
<script>
function gen(){
const t=document.getElementById('title').value;const h=document.getElementById('html').value;
document.getElementById('preview-wrap').innerHTML=`<iframe srcdoc="<!DOCTYPE html><html><head><title>${t}</title><style>body{font-family:Arial;padding:40px}@media print{@page{size:A4}}</style></head><body>${h}</body></html>"></iframe>`;
}
function print(){
const t=document.getElementById('title').value;const h=document.getElementById('html').value;
const w=window.open('','_blank');w.document.write(`<!DOCTYPE html><html><head><title>${t}</title><style>body{font-family:Arial;padding:40px}@page{size:A4;margin:1in}</style></head><body>${h}<script>window.onload=()=>{window.print();}<\/script></body></html>`);w.document.close();
}
gen();
</script></body></html>
