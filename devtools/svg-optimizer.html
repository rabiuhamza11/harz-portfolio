<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SVG Optimizer — HARZ DevTools</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;max-width:800px;margin:0 auto;padding:20px;background:#0d1117;color:#e6edf3}h1{color:#58a6ff;font-size:1.4em}label{display:block;color:#8b949e;font-size:0.85em;margin:3px 0}textarea{width:100%;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px;font-family:monospace}button{padding:10px 20px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:10px 5px 0 0}.field{margin:10px 0}pre{background:#161b22;padding:15px;border-radius:6px;font-size:0.85em;border:1px solid #30363d;margin-top:10px}div[style*="svg"]{background:#fff;padding:10px;border-radius:6px;margin:10px 0}</style></head>
<body><h1>SVG Optimizer</h1>
<div class="field"><label>Paste SVG code</label><textarea id="svg" rows="6" oninput="optimize()">&lt;svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"&gt;
  &lt;!-- comment --&gt;
  &lt;rect x="0" y="0" width="100" height="100" fill="#1f6feb"/&gt;
&lt;/svg&gt;</textarea></div>
<button onclick="optimize()">Optimize</button>
<button onclick="copy()">Copy Optimized</button>
<button onclick="download()">Download .svg</button>
<pre id="output"></pre>
<pre id="stats"></pre>
<script>
function optimize(){
let s=document.getElementById('svg').value;const orig=s.length;
s=s.replace(/<!--[\s\S]*?-->/g,'');s=s.replace(/\s+/g,' ');s=s.replace(/>\s+</g,'><');s=s.replace(/\s+>/g,'>');s=s.trim();
s=s.replace(/\sfill="none"/g,'');s=s.replace(/stroke-width="1"/g,'');
const optimized=s.length;const saved=((1-optimized/orig)*100).toFixed(1);
document.getElementById('output').textContent=s;
document.getElementById('stats').textContent=`Original: ${orig} bytes\nOptimized: ${optimized} bytes\nSaved: ${saved}%\n\nPreview:\n<div style="background:#fff;padding:10px;border-radius:6px;margin:10px 0">${s}</div>`;
const div=document.createElement('div');div.style.background='#fff';div.style.padding='10px';div.style.borderRadius='6px';div.style.marginTop='10px';div.innerHTML=s;
document.getElementById('stats').appendChild(div);
}
function copy(){navigator.clipboard.writeText(document.getElementById('output').textContent);alert('Copied!');}
function download(){const b=new Blob([document.getElementById('output').textContent],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='optimized.svg';a.click();}
optimize();
</script></body></html>
