<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nginx Config Generator — HARZ DevTools</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;max-width:800px;margin:0 auto;padding:20px;background:#0d1117;color:#e6edf3}h1{color:#58a6ff;font-size:1.4em}label{display:block;color:#8b949e;font-size:0.85em;margin:3px 0}input,select{width:100%;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px}button{padding:10px 20px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:10px 5px 0 0}.field{margin:10px 0}.row{display:flex;gap:10px}.row>div{flex:1}pre{background:#161b22;padding:15px;border-radius:6px;font-size:0.85em;border:1px solid #30363d;margin-top:10px}</style></head>
<body><h1>Nginx Config Generator</h1>
<div class="row"><div class="field"><label>Domain</label><input id="domain" value="harzdm.com" oninput="gen()"></div>
<div class="field"><label>Port</label><input id="port" value="3000" oninput="gen()"></div></div>
<div class="row"><div class="field"><label>SSL</label><select id="ssl" onchange="gen()"><option value="yes">Yes (Let's Encrypt)</option><option value="no">No</option></select></div>
<div class="field"><label>Proxy / Static</label><select id="mode" onchange="gen()"><option value="proxy">Reverse Proxy</option><option value="static">Static Files</option><option value="spa">SPA (history mode)</option></select></div></div>
<button onclick="copy()">Copy nginx.conf</button>
<pre id="output"></pre>
<script>
function gen(){
const d=document.getElementById('domain').value;const p=document.getElementById('port').value;const ssl=document.getElementById('ssl').value;const mode=document.getElementById('mode').value;
let cfg='';
if(ssl==='yes'){cfg+=`server {\n  listen 80;\n  server_name ${d} www.${d};\n  return 301 https://$host$request_uri;\n}\n\n`;}
cfg+=`server {\n  listen ${ssl==='yes'?'443 ssl':'80'};\n  server_name ${d} www.${d};\n`;
if(ssl==='yes'){cfg+=`  ssl_certificate /etc/letsencrypt/live/${d}/fullchain.pem;\n  ssl_certificate_key /etc/letsencrypt/live/${d}/privkey.pem;\n`;}
if(mode==='proxy'){cfg+=`\n  location / {\n    proxy_pass http://127.0.0.1:${p};\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n  }\n`;}
else if(mode==='static'){cfg+=`\n  root /var/www/${d};\n  index index.html;\n  location / {\n    try_files $uri $uri/ =404;\n  }\n`;}
else if(mode==='spa'){cfg+=`\n  root /var/www/${d};\n  index index.html;\n  location / {\n    try_files $uri $uri/ /index.html;\n  }\n`;}
cfg+=`\n  gzip on;\n  gzip_types text/css application/javascript application/json image/svg+xml;\n  gzip_min_length 1000;\n`;
cfg+=`\n  location ~* \\.(jpg|jpeg|png|gif|ico|css|js|woff2)$ {\n    expires 1y;\n    add_header Cache-Control "public, immutable";\n  }\n`;
cfg+=`}`;
document.getElementById('output').textContent=cfg;
}
function copy(){navigator.clipboard.writeText(document.getElementById('output').textContent);alert('Copied!');}
gen();
</script></body></html>
