<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CI/CD Pipeline Generator — HARZ DevTools</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;max-width:800px;margin:0 auto;padding:20px;background:#0d1117;color:#e6edf3}h1{color:#58a6ff;font-size:1.4em}label{display:block;color:#8b949e;font-size:0.85em;margin:3px 0}input,select{width:100%;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px}button{padding:10px 20px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:10px 5px 0 0}.field{margin:10px 0}.row{display:flex;gap:10px}.row>div{flex:1}pre{background:#161b22;padding:15px;border-radius:6px;font-size:0.85em;border:1px solid #30363d;margin-top:10px}</style></head>
<body><h1>CI/CD Pipeline Generator</h1>
<div class="row"><div class="field"><label>Platform</label><select id="platform" onchange="gen()"><option value="github">GitHub Actions</option><option value="gitlab">GitLab CI</option></select></div>
<div class="field"><label>Deploy Target</label><select id="target" onchange="gen()"><option value="cloudflare">Cloudflare Workers</option><option value="vercel">Vercel</option><option value="render">Render</option><option value="pages">GitHub Pages</option><option value="docker">Docker Registry</option></select></div></div>
<div class="row"><div class="field"><label>Node Version</label><input id="node" value="22" oninput="gen()"></div>
<div class="field"><label>Branch</label><input id="branch" value="main" oninput="gen()"></div></div>
<button onclick="copy()">Copy Pipeline YAML</button>
<button onclick="download()">Download</button>
<pre id="output"></pre>
<script>
function gen(){
const p=document.getElementById('platform').value;const t=document.getElementById('target').value;const nv=document.getElementById('node').value;const br=document.getElementById('branch').value;
let out='';
if(p==='github'){
out=`name: CI/CD\non:\n  push:\n    branches: [${br}]\n  pull_request:\n    branches: [${br}]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '${nv}'\n      - run: npm ci\n      - run: npm test\n      - run: npm run lint\n\n  deploy:\n    needs: test\n    if: github.ref == 'refs/heads/${br}'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '${nv}'\n`;
if(t==='cloudflare'){out+=`      - run: npm ci\n      - run: npm run build\n      - uses: cloudflare/wrangler-action@v3\n        with:\n          apiToken: \${{ secrets.CLOUDFLARE_API_TOKEN }}\n          accountId: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}\n`;}
else if(t==='vercel'){out+=`      - run: npm ci\n      - run: npm run build\n      - uses: amondnet/vercel-action@v25\n        with:\n          vercel-token: \${{ secrets.VERCEL_TOKEN }}\n          vercel-args: '--prod'\n`;}
else if(t==='render'){out+=`      - run: npm ci\n      - run: npm run build\n      - name: Deploy to Render\n        run: curl -X POST $RENDER_DEPLOY_HOOK\n        env:\n          RENDER_DEPLOY_HOOK: \${{ secrets.RENDER_DEPLOY_HOOK }}\n`;}
else if(t==='pages'){out+=`      - run: npm ci\n      - run: npm run build\n      - uses: peaceiris/actions-gh-pages@v3\n        with:\n          github_token: \${{ secrets.GITHUB_TOKEN }}\n          publish_dir: ./dist\n`;}
else if(t==='docker'){out+=`      - uses: docker/login-action@v3\n        with:\n          username: \${{ secrets.DOCKER_USER }}\n          password: \${{ secrets.DOCKER_PASS }}\n      - uses: docker/build-push-action@v5\n        with:\n          push: true\n          tags: \${{ secrets.DOCKER_USER }}/app:latest\n`;}
}
else{out=`stages:\n  - test\n  - deploy\n\ntest:\n  stage: test\n  image: node:${nv}\n  script:\n    - npm ci\n    - npm test\n    - npm run lint\n\ndeploy:\n  stage: deploy\n  only:\n    - ${br}\n  script:\n    - npm ci\n    - npm run build\n    - wrangler deploy\n  environment: production\n`;}
document.getElementById('output').textContent=out;
}
function copy(){navigator.clipboard.writeText(document.getElementById('output').textContent);alert('Copied!');}
function download(){const b=new Blob([document.getElementById('output').textContent],{type:'text/yaml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=document.getElementById('platform').value==='github'?'deploy.yml':'.gitlab-ci.yml';a.click();}
gen();
</script></body></html>
