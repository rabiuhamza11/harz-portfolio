<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base64 Encoder — HARZ Toolkit</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}.c{max-width:700px;margin:0 auto}h1{text-align:center;font-size:1.8rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}.sub{text-align:center;color:#94a3b8;margin-bottom:30px;font-size:.9rem}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;margin-bottom:20px}.card h2{font-size:1.1rem;margin-bottom:16px;color:#60a5fa}textarea{width:100%;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:.85rem;font-family:monospace;min-height:120px;resize:vertical}textarea:focus{outline:none;border-color:#3b82f6}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:8px 16px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-size:.85rem}.btn.sec{background:#334155}.out{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;font-family:monospace;font-size:.85rem;color:#a5b4fc;word-break:break-all;min-height:60px}.label{font-size:.8rem;color:#94a3b8;margin-bottom:5px}.url-toggle{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:.85rem}.url-toggle input{width:18px;height:18px;accent-color:#3b82f6}</style>
</head>
<body>
<div class="c">
<h1>Base64 Encoder / Decoder</h1><p class="sub">Encode and decode Base64, URL, and UTF-8</p>
<div class="card"><h2>Encode</h2>
<div class="label">Plain Text</div><textarea id="encodeInput" oninput="encode()" placeholder="Enter text to encode">Hello HARZ Cloud!</textarea>
<div class="btns"><button class="btn" onclick="encode()">Encode</button><button class="btn sec" onclick="copyEnc()">Copy Result</button></div>
<div class="label" style="margin-top:12px">Base64 Output</div><div class="out" id="encodeOutput"></div>
</div>
<div class="card"><h2>Decode</h2>
<div class="label">Base64 String</div><textarea id="decodeInput" oninput="decode()" placeholder="Paste Base64 to decode"></textarea>
<div class="btns"><button class="btn" onclick="decode()">Decode</button><button class="btn sec" onclick="copyDec()">Copy Result</button></div>
<div class="label" style="margin-top:12px">Decoded Output</div><div class="out" id="decodeOutput"></div>
</div>
<div class="card"><h2>URL Encode/Decode</h2>
<div class="label">Text</div><textarea id="urlInput" oninput="urlEncode()" placeholder="Enter URL or text">https://harz-cloud.pages.dev/search?q=hello world&lang=en</textarea>
<div class="btns"><button class="btn" onclick="urlEncode()">URL Encode</button><button class="btn sec" onclick="urlDecode()">URL Decode</button></div>
<div class="out" id="urlOutput" style="margin-top:12px"></div>
</div>
<div class="card"><h2>File to Base64</h2>
<input type="file" id="fileInput" style="color:#94a3b8;margin-bottom:12px">
<div class="out" id="fileOutput" style="max-height:200px;overflow-y:auto">Select a file to encode as Base64</div>
</div>
</div>
<script>
function encode(){const text=document.getElementById('encodeInput').value;try{document.getElementById('encodeOutput').textContent=btoa(unescape(encodeURIComponent(text)));}catch(e){document.getElementById('encodeOutput').textContent='Error: '+e.message;}}
function decode(){const b64=document.getElementById('decodeInput').value.trim();try{document.getElementById('decodeOutput').textContent=decodeURIComponent(escape(atob(b64)));}catch(e){document.getElementById('decodeOutput').textContent='Error: Invalid Base64';}}
function urlEncode(){const text=document.getElementById('urlInput').value;document.getElementById('urlOutput').textContent=encodeURIComponent(text);}
function urlDecode(){const text=document.getElementById('urlInput').value;try{document.getElementById('urlOutput').textContent=decodeURIComponent(text);}catch(e){document.getElementById('urlOutput').textContent='Error: Invalid URL encoding';}}
function copyEnc(){navigator.clipboard.writeText(document.getElementById('encodeOutput').textContent);alert('Base64 copied!');}
function copyDec(){navigator.clipboard.writeText(document.getElementById('decodeOutput').textContent);alert('Decoded text copied!');}
document.getElementById('fileInput').addEventListener('change',function(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(){document.getElementById('fileOutput').textContent=reader.result;};reader.readAsDataURL(file);});
encode();urlEncode();
</script>
</body></html>
