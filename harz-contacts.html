<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARZ Contacts — CRM</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--p1:#7c4dff;--p2:#5362f6;--p3:#00d4aa}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:70px}
.header{position:sticky;top:0;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;border-bottom:1px solid var(--border)}
.header h1{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search-bar{padding:10px 16px 0}
.search-bar input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:.85rem}
.search-bar input:focus{outline:none;border-color:var(--p1)}
.cat-tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cat-tab{padding:6px 14px;border-radius:20px;font-size:.72rem;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:.2s}
.cat-tab.active{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent;color:#fff}
.contact-list{padding:0 16px}
.contact-card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;transition:.2s}
.contact-card:active{transform:scale(.98)}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;flex-shrink:0}
.c-info{flex:1;min-width:0}
.c-name{font-size:.88rem;font-weight:600}
.c-desc{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-cat{font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:2px}
.c-actions{display:flex;gap:6px;flex-shrink:0}
.c-btn{width:34px;height:34px;border-radius:8px;border:none;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.c-btn.call{background:rgba(34,197,94,.12);color:#22c55e}
.c-btn.sms{background:rgba(59,130,246,.12);color:#3b82f6}
.c-btn.whatsapp{background:rgba(0,230,118,.12);color:#00e676}
.stat-row{display:flex;gap:8px;padding:10px 16px}
.stat-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat-card .stat-num{font-size:1.2rem;font-weight:700}
.stat-card .stat-lbl{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px;max-height:80vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:1.1rem;margin-bottom:14px}
.form-group{margin-bottom:10px}
.form-label{font-size:.72rem;color:var(--muted);margin-bottom:4px;display:block}
.form-input,.form-select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-size:.85rem;font-family:inherit}
.form-input:focus{outline:none;border-color:var(--p1)}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:10px;font-size:.85rem;font-weight:600;border:none;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.btn-cancel{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.fab{position:fixed;bottom:16px;right:16px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p2));border:none;color:#fff;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 20px rgba(124,77,255,.4);z-index:90;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.9)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:20px;font-size:.78rem;z-index:400;opacity:0;transition:.3s}
.toast.show{opacity:1;bottom:90px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .emoji{font-size:2.5rem;margin-bottom:8px}
</style>
</head>
<body>
<div class="header"><h1>👥 HARZ Contacts</h1></div>
<div class="stat-row">
<div class="stat-card"><div class="stat-num" id="stTotal">0</div><div class="stat-lbl">Total</div></div>
<div class="stat-card"><div class="stat-num" id="stParent">0</div><div class="stat-lbl">Parents</div></div>
<div class="stat-card"><div class="stat-num" id="stFarmer">0</div><div class="stat-lbl">Farmers</div></div>
<div class="stat-card"><div class="stat-num" id="stClient">0</div><div class="stat-lbl">Clients</div></div>
</div>
<div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 Search name, phone, category..." oninput="render()"></div>
<div class="cat-tabs" id="catTabs"></div>
<div class="contact-list" id="contactList"></div>
<button class="fab" onclick="openModal()">+</button>
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h2 id="modalTitle">Add Contact</h2>
<div class="form-group"><label class="form-label">Name</label><input class="form-input" id="cName" placeholder="Full name"></div>
<div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="cPhone" placeholder="080..."></div>
<div class="form-group"><label class="form-label">Email (optional)</label><input class="form-input" id="cEmail" placeholder="email@example.com"></div>
<div class="form-group"><label class="form-label">Category</label>
<select class="form-select" id="cCat">
<option value="parent">🏫 Parent</option>
<option value="farmer">🌾 Farmer</option>
<option value="client">🏗️ Construction Client</option>
<option value="customer">🛍️ Customer</option>
<option value="supplier">📦 Supplier</option>
<option value="staff">👤 Staff</option>
<option value="other">📋 Other</option>
</select></div>
<div class="form-group"><label class="form-label">Notes</label><input class="form-input" id="cNotes" placeholder="Notes..."></div>
<div class="modal-actions"><button class="btn btn-cancel" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveContact()">Save</button></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const catColors={parent:'#3b82f6',farmer:'#22c55e',client:'#f59e0b',customer:'#a855f7',supplier:'#00d4aa',staff:'#ec4899',other:'#8b949e'};
const catLabels={parent:'Parent',farmer:'Farmer',client:'Client',customer:'Customer',supplier:'Supplier',staff:'Staff',other:'Other'};
let contacts=[],activeCat='all',editingId=null;
function load(){try{contacts=JSON.parse(localStorage.getItem('harz_contacts')||'[]')}catch(e){contacts=[]}}
function save(){localStorage.setItem('harz_contacts',JSON.stringify(contacts))}
function seed(){
if(contacts.length>0)return;
const s=[
{name:'Malam Musa Bello',phone:'08031234567',email:'musa@gmail.com',cat:'parent',notes:'Parent of Aisha — JSS2'},
{name:'Hajiya Fatima Sani',phone:'08067654321',email:'',cat:'parent',notes:'Parent of Yusuf — Pry5'},
{name:'Alhaji Tanko Ibrahim',phone:'08011223344',email:'tanko@farm.ng',cat:'farmer',notes:'Tomato farmer — Zaria'},
{name:'Malam Audu Dauda',phone:'08098765432',email:'',cat:'farmer',notes:'Cattle — 50 heads'},
{name:'Engr. Sani Garba',phone:'08055554444',email:'sani@construction.com',cat:'client',notes:'Wuse duplex project'},
{name:'Mrs. Grace Okoro',phone:'08077776666',email:'grace@okoro.com',cat:'client',notes:'Gwarimpa renovation'},
{name:'HarzDM Customer',phone:'08033333222',email:'',cat:'customer',notes:'Bought 3 products'},
{name:'Cement Depot',phone:'08044444555',email:'',cat:'supplier',notes:'Building materials supplier'},
{name:'Malam Kabiru',phone:'08066666777',email:'',cat:'staff',notes:'Danfodio Memorial — Headmaster'},
{name:'Alhaji Bala Mohammed',phone:'08011112222',email:'',cat:'other',notes:'Community leader'}
];
s.forEach(c=>{c.id=Math.random().toString(36).substr(2,9);contacts.push(c)});
save();
}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function render(){
const search=document.getElementById('searchInput').value.toLowerCase();
const filtered=contacts.filter(c=>{
if(activeCat!=='all'&&c.cat!==activeCat)return false;
if(search&&!c.name.toLowerCase().includes(search)&&!c.phone.includes(search)&&!catLabels[c.cat].toLowerCase().includes(search))return false;
return true;
});
document.getElementById('stTotal').textContent=contacts.length;
document.getElementById('stParent').textContent=contacts.filter(c=>c.cat==='parent').length;
document.getElementById('stFarmer').textContent=contacts.filter(c=>c.cat==='farmer').length;
document.getElementById('stClient').textContent=contacts.filter(c=>c.cat==='client').length;
const tabs=['all',...Object.keys(catLabels)];
document.getElementById('catTabs').innerHTML=tabs.map(t=>`<div class="cat-tab ${activeCat===t?'active':''}" onclick="setCat('${t}')">${t==='all'?'All':catLabels[t]}</div>`).join('');
const list=document.getElementById('contactList');
if(filtered.length===0){list.innerHTML='<div class="empty"><div class="emoji">👥</div><p>No contacts found. Tap + to add.</p></div>';return}
list.innerHTML=filtered.map(c=>`
<div class="contact-card" onclick="editContact('${c.id}')">
<div class="avatar" style="background:${catColors[c.cat]}22;color:${catColors[c.cat]}">${initials(c.name)}</div>
<div class="c-info">
<div class="c-name">${esc(c.name)}</div>
<div class="c-desc">${c.phone}${c.notes?' · '+esc(c.notes):''}</div>
<div class="c-cat" style="color:${catColors[c.cat]}">${catLabels[c.cat]}</div>
</div>
<div class="c-actions">
<a class="c-btn call" href="tel:${c.phone}">📞</a>
<a class="c-btn sms" href="sms:${c.phone}">💬</a>
<a class="c-btn whatsapp" href="https://wa.me/234${c.phone.replace(/^0/,'')}">🟢</a>
</div>
</div>`).join('');
}
function setCat(c){activeCat=c;render()}
function openModal(){editingId=null;document.getElementById('modalTitle').textContent='Add Contact';['cName','cPhone','cEmail','cNotes'].forEach(i=>document.getElementById(i).value='');document.getElementById('cCat').value='parent';document.getElementById('modalOverlay').classList.add('show')}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
function editContact(id){const c=contacts.find(x=>x.id===id);if(!c)return;editingId=id;document.getElementById('modalTitle').textContent='Edit Contact';document.getElementById('cName').value=c.name;document.getElementById('cPhone').value=c.phone;document.getElementById('cEmail').value=c.email||'';document.getElementById('cCat').value=c.cat;document.getElementById('cNotes').value=c.notes||'';document.getElementById('modalOverlay').classList.add('show')}
function saveContact(){
const name=document.getElementById('cName').value.trim();if(!name){showToast('Enter a name');return}
const data={name,phone:document.getElementById('cPhone').value.trim(),email:document.getElementById('cEmail').value.trim(),cat:document.getElementById('cCat').value,notes:document.getElementById('cNotes').value.trim()};
if(editingId){Object.assign(contacts.find(c=>c.id===editingId),data)}else{data.id=Math.random().toString(36).substr(2,9);contacts.push(data)}
save();closeModal();render();showToast('Saved ✓');
}
function delContact(){if(!editingId)return;if(confirm('Delete this contact?')){contacts=contacts.filter(c=>c.id!==editingId);save();closeModal();render();showToast('Deleted')}}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
load();seed();render();
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal()});
</script>
</body>
</html>
