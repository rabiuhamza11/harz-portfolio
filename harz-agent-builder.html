<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<title>HARZ Agent Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--p1:#58a6ff;--p2:#7c3aed;--p3:#3fa550;--red:#f85149}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:60px}
.header{background:linear-gradient(135deg,var(--p2),var(--p1));padding:20px 16px;color:#fff;position:sticky;top:0;z-index:100}
.header h1{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.header .sub{font-size:.7rem;opacity:.8;margin-top:4px}
.section{padding:0 16px;margin-bottom:20px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-top:16px}
.section-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.section-link{font-size:.7rem;color:var(--p1);cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.card-tap{cursor:pointer;transition:transform .15s}
.card-tap:active{transform:scale(.97)}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.85rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p1)}
textarea{min-height:80px;resize:vertical;font-family:inherit}
label{font-size:.7rem;color:var(--muted);margin-bottom:4px;display:block;font-weight:600}
.field{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:10px;border:none;font-size:.85rem;font-weight:600;cursor:pointer;width:100%}
.btn-blue{background:linear-gradient(135deg,var(--p2),var(--p1));color:#fff}
.btn:active{transform:scale(.97)}
.badge{display:inline-flex;font-size:.55rem;padding:2px 8px;border-radius:10px;font-weight:700}
.badge-live{background:rgba(63,185,80,.15);color:var(--p3)}
.badge-draft{background:rgba(88,166,255,.15);color:var(--p1)}
.chat-log{background:#000;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:monospace;font-size:.75rem;color:var(--p3);max-height:250px;overflow:auto;white-space:pre-wrap;line-height:1.5}
.chat-row{display:flex;gap:8px;margin-bottom:8px}
.avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.agent-name{font-size:.85rem;font-weight:700}
.agent-role{font-size:.68rem;color:var(--muted)}
.agent-status{font-size:.6rem;padding:2px 6px;border-radius:8px}
.empty{text-align:center;padding:20px;color:var(--muted);font-size:.8rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--p1);color:var(--text);padding:10px 20px;border-radius:10px;font-size:.8rem;z-index:200;display:none;max-width:90vw;text-align:center}
.loading{text-align:center;padding:8px;color:var(--muted);font-size:.75rem}
.stats{display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem}
.stat-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.stat-item b{color:var(--p1)}
.row{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>

<div class="header">
<h1>🤖 HARZ Agent Builder</h1>
<div class="sub">Create custom AI agents — powered by Omega Producer v3</div>
</div>

<div class="section">
<div class="section-head">
<span class="section-title">Create New Agent</span>
<span class="badge badge-live">LIVE</span>
</div>
<div class="card" style="border-color:var(--p2)">
<div class="field">
<label>Agent Name</label>
<input id="ab-name" placeholder="e.g. Talle Market Expert">
</div>
<div class="field">
<label>Role / Specialty</label>
<input id="ab-role" placeholder="e.g. Market Research & Pricing">
</div>
<div class="field">
<label>Avatar</label>
<select id="ab-avatar">
<option value="🤖">🤖 Robot</option>
<option value="📈">📈 Chart</option>
<option value="💻">💻 Code</option>
<option value="✍️">✍️ Writer</option>
<option value="🎨">🎨 Artist</option>
<option value="📊">📊 Analytics</option>
<option value="🛡️">🛡️ Security</option>
<option value="💰">💰 Finance</option>
<option value="📚">📚 Knowledge</option>
<option value="🎯">🎯 Target</option>
<option value="🧠">🧠 Brain</option>
<option value="🚀">🚀 Rocket</option>
<option value="🔥">🔥 Fire</option>
<option value="⚡">⚡ Energy</option>
<option value="🌟">🌟 Star</option>
</select>
</div>
<div class="field">
<label>AI Model</label>
<select id="ab-model">
<option value="nvidia/nemotron-3-ultra-550b-a55b:free">Nemotron 550B (Smart)</option>
<option value="nvidia/nemotron-3-super-120b-a12b:free">Nemotron 120B (Fast)</option>
<option value="nvidia/nemotron-3-mini-4b-instruct:free">Nemotron 4B (Light)</option>
</select>
</div>
<div class="field">
<label>System Prompt (personality & instructions)</label>
<textarea id="ab-prompt" placeholder="You are Talle, a market research expert. You analyze trends, suggest pricing, and identify profitable niches. You speak English, Hausa, and Pidgin."></textarea>
</div>
<div class="field">
<label>Welcome Message</label>
<input id="ab-welcome" placeholder="Sannu! Ni Talle ne. Ina taimaka maka...">
</div>
<button class="btn btn-blue" onclick="abCreateAgent()">🚀 Create Agent</button>
</div>
</div>

<div class="section">
<div class="section-head">
<span class="section-title">Your AI Agents</span>
<span class="section-link" onclick="abLoadAgents()">↻ Refresh</span>
</div>
<div id="ab-agent-list"><div class="loading">Loading agents...</div></div>
</div>

<div class="section" id="chat-section" style="display:none">
<div class="section-head">
<span class="section-title">Chat</span>
<span id="ab-chat-name" style="font-size:.8rem;font-weight:700;color:var(--p1)"></span>
</div>
<div class="chat-log" id="ab-chat-log">Select an agent to start chatting.</div>
<div style="display:flex;gap:8px;margin-top:8px">
<input id="ab-chat-input" placeholder="Type message..." style="flex:1" onkeypress="if(event.key==='Enter')abSendMessage()">
<button class="btn btn-blue" style="width:auto;padding:10px 16px" onclick="abSendMessage()">➤</button>
</div>
</div>

<div class="section">
<div class="section-head">
<span class="section-title">Backend Stats</span>
<span class="section-link" onclick="abLoadStats()">↻ Refresh</span>
</div>
<div id="ab-stats" class="loading">Loading...</div>
</div>

<div class="toast" id="toast"></div>

<script>
const BACKEND='https://harz-backend.harz.workers.dev';
const PRODUCER='https://superagent-2286fb2f.base44.app/functions/omegaProducer';
const KEY='omega_harz_321424_2026';
let currentAgent=null;

function showToast(msg){
var t=document.getElementById('toast');
t.textContent=msg;t.style.display='block';
setTimeout(function(){t.style.display='none'},2500);
}

async function abCreateAgent(){
var name=document.getElementById('ab-name').value.trim();
var role=document.getElementById('ab-role').value.trim();
var prompt=document.getElementById('ab-prompt').value.trim();
var avatar=document.getElementById('ab-avatar').value;
var model=document.getElementById('ab-model').value;
var welcome=document.getElementById('ab-welcome').value.trim()||'Hello! How can I help you?';
if(!name||!role||!prompt){showToast('Fill name, role, and prompt');return;}
showToast('Creating '+name+'...');
try{
var r=await fetch(BACKEND+'/api/custom_agents',{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({name:name,role:role,system_prompt:prompt,model:model,avatar:avatar,color:'#58a6ff',capabilities:'chat',welcome_message:welcome})
});
var d=await r.json();
if(d.success){
showToast('Agent '+name+' created!');
document.getElementById('ab-name').value='';
document.getElementById('ab-role').value='';
document.getElementById('ab-prompt').value='';
document.getElementById('ab-welcome').value='';
abLoadAgents();
}else{showToast('Error: '+(d.error||'Failed'));}
}catch(e){showToast('Error: '+e.message);}
}

async function abLoadAgents(){
try{
var r=await fetch(BACKEND+'/api/custom_agents');
var d=await r.json();
var el=document.getElementById('ab-agent-list');
if(!d.data||d.count===0){el.innerHTML='<div class="empty">No agents yet. Create one above!</div>';return;}
var html='';
for(var i=0;i<d.data.length;i++){
var a=d.data[i];
var sc=a.status==='active'?'badge-live':'badge-draft';
var sb=a.status==='active'?'rgba(63,185,80,.15)':'rgba(88,166,255,.15)';
var st=a.status==='active'?'var(--p3)':'var(--p1)';
var oid=a.id.replace(/'/g,'');
var nm=a.name.replace(/'/g,'');
var pp=(a.system_prompt||'').substring(0,300).replace(/'/g,'');
var wm=(a.welcome_message||'Hello').replace(/'/g,'');
var md=a.model||'';
html+='<div class="card card-tap" onclick="abSelectAgent(\''+oid+'\',\''+nm+'\',\''+pp+'\',\''+md+'\',\''+wm+'\')">';
html+='<div class="row"><div class="avatar" style="background:rgba(124,77,255,.15)">'+(a.avatar||'🤖')+'</div>';
html+='<div style="flex:1"><div class="agent-name">'+a.name+'</div>';
html+='<div class="agent-role">'+a.role+'</div></div>';
html+='<div class="agent-status '+sc+'" style="background:'+sb+';color:'+st+'">'+a.status+'</div>';
html+='</div></div>';
}
el.innerHTML=html;
}catch(e){document.getElementById('ab-agent-list').innerHTML='<div class="empty">Error: '+e.message+'</div>';}
}

function abSelectAgent(id,name,prompt,model,welcome){
currentAgent={id:id,name:name,prompt:prompt,model:model};
document.getElementById('chat-section').style.display='block';
document.getElementById('ab-chat-name').textContent=name;
document.getElementById('ab-chat-log').textContent=welcome;
showToast('Selected: '+name);
}

async function abSendMessage(){
var input=document.getElementById('ab-chat-input');
var msg=input.value.trim();
if(!msg)return;
if(!currentAgent){showToast('Select an agent first');return;}
var log=document.getElementById('ab-chat-log');
log.textContent+='\n\nYou: '+msg+'\n';
input.value='';
log.textContent+='['+currentAgent.name+' thinking...]\n';
log.scrollTop=log.scrollHeight;
try{
var r=await fetch(PRODUCER,{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:msg,api_key:KEY,history:[{role:'system',content:currentAgent.prompt},{role:'user',content:msg}]})
});
var d=await r.json();
if(d.response){
log.textContent+=currentAgent.name+': '+d.response+'\n';
fetch(BACKEND+'/api/agent_chats',{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({agent_id:currentAgent.id,agent_name:currentAgent.name,user_message:msg,agent_response:d.response.substring(0,500),model:d.model||currentAgent.model})
}).catch(function(){});
}else{log.textContent+='Error: No response\n';}
}catch(e){log.textContent+='Error: '+e.message+'\n';}
log.scrollTop=log.scrollHeight;
}

async function abLoadStats(){
try{
var r=await fetch(BACKEND+'/stats');
var d=await r.json();
var s=d.stats||{};
var h='<div class="card"><div class="stats">';
h+='<div class="stat-item">Agents: <b>'+(s.custom_agents||0)+'</b></div>';
h+='<div class="stat-item">Chats: <b>'+(s.agent_chats||0)+'</b></div>';
h+='<div class="stat-item">Orders: <b>'+(s.orders||0)+'</b></div>';
h+='<div class="stat-item">CRM: <b>'+(s.crm||0)+'</b></div>';
h+='<div class="stat-item">Products: <b>'+(s.products||0)+'</b></div>';
h+='<div class="stat-item">Users: <b>'+(s.total_users||0)+'</b></div>';
h+='</div></div>';
document.getElementById('ab-stats').innerHTML=h;
}catch(e){document.getElementById('ab-stats').innerHTML='Error: '+e.message;}
}

abLoadAgents();
abLoadStats();
</script>
</body>
</html>
