<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARZ Weather — Farm Forecast</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--p1:#7c4dff;--p2:#5362f6;--p3:#00d4aa}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:20px}
.header{position:sticky;top:0;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;border-bottom:1px solid var(--border)}
.header h1{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.current-card{margin:12px 16px;background:linear-gradient(135deg,var(--p1),var(--p2));border-radius:18px;padding:24px;text-align:center}
.current-card .location{font-size:.85rem;opacity:.8}
.current-card .temp{font-size:3.5rem;font-weight:700;margin:8px 0}
.current-card .desc{font-size:1rem;opacity:.9}
.current-card .icon{font-size:3rem;margin-bottom:4px}
.current-meta{display:flex;justify-content:center;gap:20px;margin-top:12px;font-size:.75rem;opacity:.85}
.forecast-title{padding:12px 16px 4px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.forecast-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 16px}
.forecast-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center}
.forecast-card .fc-day{font-size:.65rem;color:var(--muted);font-weight:600}
.forecast-card .fc-icon{font-size:1.5rem;margin:4px 0}
.forecast-card .fc-temp{font-size:.8rem;font-weight:700}
.forecast-card .fc-rain{font-size:.58rem;color:#3b82f6;margin-top:2px}
.advice-section{margin:12px 16px}
.advice-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.advice-card .ac-title{font-size:.82rem;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.advice-card .ac-text{font-size:.75rem;color:var(--muted);line-height:1.5}
.city-select{padding:10px 16px}
.city-select select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:.85rem}
.hourly{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.hour-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 6px;text-align:center;min-width:60px;flex-shrink:0}
.hour-card .hc-time{font-size:.62rem;color:var(--muted)}
.hour-card .hc-icon{font-size:1.2rem;margin:2px 0}
.hour-card .hc-temp{font-size:.72rem;font-weight:700}
.refresh-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:.72rem;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>🌦️ HARZ Weather</h1><button class="refresh-btn" onclick="loadWeather()">↻ Refresh</button></div>
<div class="city-select">
<select id="citySelect" onchange="loadWeather()">
<option value="Kano">Kano</option>
<option value="Zaria">Zaria</option>
<option value="Kaduna">Kaduna</option>
<option value="Abuja">Abuja</option>
<option value="Lagos">Lagos</option>
<option value="Katsina">Katsina</option>
<option value="Sokoto">Sokoto</option>
<option value="Kano">Kano</option>
<option value="Maiduguri">Maiduguri</option>
<option value="Jos">Jos</option>
<option value="Ibadan">Ibadan</option>
</select>
</div>
<div class="current-card" id="currentCard">
<div class="icon">⏳</div>
<div class="temp">--°</div>
<div class="desc">Loading...</div>
</div>
<div class="forecast-title">7-Day Forecast</div>
<div class="forecast-grid" id="forecastGrid"></div>
<div class="forecast-title">Hourly (Next 12h)</div>
<div class="hourly" id="hourly"></div>
<div class="forecast-title">🌾 Farm Advisory</div>
<div class="advice-section" id="advice"></div>
<script>
const weatherCodes={0:'☀️ Clear',1:'🌤️ Mainly Clear',2:'⛅ Partly Cloudy',3:'☁️ Overcast',45:'🌫️ Fog',48:'🌫️ Frost Fog',51:'🌦️ Light Drizzle',53:'🌧️ Drizzle',55:'🌧️ Heavy Drizzle',61:'🌧️ Light Rain',63:'🌧️ Rain',65:'🌧️ Heavy Rain',66:'🌧️ Freezing Rain',71:'🌨️ Light Snow',73:'🌨️ Snow',75:'🌨️ Heavy Snow',80:'🌦️ Rain Showers',81:'🌧️ Rain Showers',82:'⛈️ Violent Showers',95:'⛈️ Thunderstorm',96:'⛈️ Thunderstorm+Hail',99:'⛈️ Thunderstorm+Hail'};
function codeIcon(c){const m={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌧️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};return m[c]||'🌤️'}
async function loadWeather(){
const city=document.getElementById('citySelect').value;
try{
const geoRes=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&countryCode=NG&count=1`);
const geo=await geoRes.json();
if(!geo.results||geo.results.length===0){throw new Error('City not found')}
const{latitude,longitude}=geo.results[0];
const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Africa/Lagos&forecast_days=7`);
const data=await res.json();
// Current
const cur=data.current;
document.getElementById('currentCard').innerHTML=`
<div class="location">📍 ${city}</div>
<div class="icon">${codeIcon(cur.weather_code)}</div>
<div class="temp">${Math.round(cur.temperature_2m)}°C</div>
<div class="desc">${weatherCodes[cur.weather_code]||'--'}</div>
<div class="current-meta">
<span>💧 ${cur.relative_humidity_2m}%</span>
<span>💨 ${Math.round(cur.wind_speed_10m)} km/h</span>
<span>🌡️ Feels ${Math.round(cur.temperature_2m+2)}°C</span>
</div>`;
// 7-day
const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let fhtml='';
for(let i=0;i<7;i++){
const d=new Date(data.daily.time[i]);
const rain=data.daily.precipitation_probability_max[i]||0;
fhtml+=`<div class="forecast-card">
<div class="fc-day">${i===0?'Today':days[d.getDay()]}</div>
<div class="fc-icon">${codeIcon(data.daily.weather_code[i])}</div>
<div class="fc-temp">${Math.round(data.daily.temperature_2m_max[i])}°/${Math.round(data.daily.temperature_2m_min[i])}°</div>
<div class="fc-rain">${rain}% 🌧️</div>
</div>`}
document.getElementById('forecastGrid').innerHTML=fhtml;
// Hourly
let hhtml='';
const now=new Date();
for(let h=0;h<12;h++){
const idx=now.getHours()+h;
if(idx>=data.hourly.time.length)break;
const d=new Date(data.hourly.time[idx]);
hhtml+=`<div class="hour-card">
<div class="hc-time">${d.getHours()}:00</div>
<div class="hc-icon">${codeIcon(data.hourly.weather_code[idx])}</div>
<div class="hc-temp">${Math.round(data.hourly.temperature_2m[idx])}°</div>
</div>`}
document.getElementById('hourly').innerHTML=hhtml;
// Advisory
const avgTemp=data.daily.temperature_2m_max.reduce((a,b)=>a+b,0)/7;
const rainDays=data.daily.precipitation_probability_max.filter(p=>p>50).length;
const advisories=[];
if(rainDays>=3)advisories.push({icon:'🌧️',title:'High Rainfall Expected',text:`${rainDays} days with >50% rain chance this week. Delay harvest, secure storage, prepare drainage for your plots.`});
else if(rainDays>=1)advisories.push({icon:'🌦️',title:'Some Rain Coming',text:`${rainDays} day(s) with rain expected. Plan irrigation accordingly — reduce watering on rainy days.`});
else advisories.push({icon:'☀️',title:'Dry Week Ahead',text:'No significant rain expected. Increase irrigation, check soil moisture, and water crops early morning or evening.'});
if(avgTemp>35)advisories.push({icon:'🌡️',title:'Heat Stress Warning',text:`Avg ${Math.round(avgTemp)}°C. Provide shade for livestock, increase water supply, avoid midday field work.`});
else if(avgTemp<20)advisories.push({icon:'❄️',title:'Cool Conditions',text:`Avg ${Math.round(avgTemp)}°C. Monitor cold-sensitive crops. Consider protective covering overnight.`});
advisories.push({icon:'💧',title:'Irrigation Tip',text:rainDays>=3?'Skip irrigation on rainy days. Ensure drainage channels are clear.':'Water early morning (6-8am) or evening (5-7pm) to reduce evaporation.'});
advisories.push({icon:'🌾',title:'Farm Operations',text:rainDays>=2?'Good time for planting if soil is prepared. Hold off on fertilizer application before heavy rain.':'Good conditions for fertilizer application and crop maintenance.'});
document.getElementById('advice').innerHTML=advisories.map(a=>`<div class="advice-card"><div class="ac-title">${a.icon} ${a.title}</div><div class="ac-text">${a.text}</div></div>`).join('');
}catch(e){
document.getElementById('currentCard').innerHTML='<div class="icon">⚠️</div><div class="temp">--</div><div class="desc">Failed to load weather. Tap Refresh.</div>';
}
}
loadWeather();
</script>
</body>
</html>
