<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HarzPay Gateway</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:12px;max-width:600px;margin:0 auto}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin-bottom:10px}.card h2{color:#58a6ff;font-size:14px;margin-bottom:8px}input,button{background:#1c2333;border:1px solid #30363d;border-radius:8px;padding:8px 10px;color:#e6edf3;margin:4px 0;width:100%;font-size:14px}button{background:#3fb950;color:#000;font-weight:700;cursor:pointer}.method{display:flex;align-items:center;gap:8px;padding:10px;background:#1c2333;border-radius:8px;margin:4px 0;cursor:pointer;border:2px solid transparent}.method.active{border-color:#3fb950}</style></head><body><div class="card"><h2>&#128179; HarzPay Gateway</h2><p style="color:#8b949e;font-size:12px">Accept payments: Card, Bank, USDT</p></div><div class="card"><h2>Payment Details</h2><input id="amount" type="number" placeholder="Amount (&#8358;)"><input id="email" type="email" placeholder="Customer email"><input id="ref" placeholder="Reference (optional)"></div><div class="card"><h2>Payment Method</h2><div class="method active" onclick="selectMethod(this,'card')">&#128179; <b>Card</b> (Paystack)</div><div class="method" onclick="selectMethod(this,'bank')">&#127974; <b>Bank Transfer</b></div><div class="method" onclick="selectMethod(this,'usdt')">&#129309; <b>USDT</b> (TRC20)</div><button onclick="pay()">Process Payment</button><div id="result" style="margin-top:8px"></div></div><div class="card"><h2>Bank Details</h2><p style="font-size:12px">Bank: HARZ Bank<br>Account: 0123456789<br>Name: HARZ Enterprises</p></div><div class="card"><h2>USDT Address</h2><p style="font-size:12px;word-break:break-all">TRC20: TXxxxxxxxxxxxxxxxxxxxxxxxxxxxx</p></div><script>var method='card';function selectMethod(el,m){document.querySelectorAll('.method').forEach(e=>e.classList.remove('active'));el.classList.add('active');method=m}function pay(){var amt=document.getElementById('amount').value;if(!amt||amt<=0){document.getElementById('result').innerHTML='<p style="color:#f85149">Enter valid amount</p>';return}var email=document.getElementById('email').value||'customer@harz.com';var ref=document.getElementById('ref').value||'HARZ-'+Date.now().toString(36);var msg='';if(method==='card'){msg='Redirecting to Paystack for \\u20A6'+amt+'...'}else if(method==='bank'){msg='Please transfer \\u20A6'+amt+' to HARZ Bank 0123456789. Ref: '+ref}else{msg='Send '+amt+' NGN in USDT (TRC20) to TXxxxx. Ref: '+ref}document.getElementById('result').innerHTML='<div style="color:#3fb950;padding:10px;background:rgba(63,185,80,.1);border-radius:8px">'+msg+'</div>'}</script></body></html>
