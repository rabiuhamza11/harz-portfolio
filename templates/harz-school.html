<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danfodio School Portal</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:12px;max-width:600px;margin:0 auto}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin-bottom:10px}.card h2{color:#58a6ff;font-size:14px;margin-bottom:8px}input,select,button{background:#1c2333;border:1px solid #30363d;border-radius:8px;padding:8px;color:#e6edf3;margin:4px 0;width:100%}button{background:#3fb950;color:#000;font-weight:700;cursor:pointer}.student{background:#1c2333;border-radius:8px;padding:10px;margin:4px 0}.grade-A{color:#3fb950}.grade-B{color:#58a6ff}.grade-C{color:#d29922}.grade-F{color:#f85149}</style></head><body><div class="card"><h2>&#127891; Danfodio School Portal</h2><p style="color:#8b949e;font-size:12px">Student results, attendance & grading</p></div><div class="card"><h2>Add Student</h2><input id="sn" placeholder="Student name"><select id="sc"><option>Nursery</option><option>Primary 1</option><option>Primary 2</option><option>JSS 1</option><option>JSS 2</option><option>SSS 1</option><option>SSS 2</option><option>SSS 3</option></select><input id="sm" type="number" placeholder="Math score (0-100)"><input id="se" type="number" placeholder="English score (0-100)"><input id="ss" type="number" placeholder="Science score (0-100)"><button onclick="addStudent()">Add Student</button></div><div class="card"><h2>Student Records</h2><div id="students"></div></div><div class="card"><h2>Class Statistics</h2><div id="stats"></div></div><script>var students=JSON.parse(localStorage.getItem('danfodioStudents')||'[]');function grade(s){return s>=80?'A':s>=60?'B':s>=50?'C':'F'}function avg(a,b,c){return Math.round((a+b+c)/3)}function render(){var html=students.map((s,i)=>{var a=avg(s.math,s.eng,s.sci);var g=grade(a);return '<div class="student"><b>'+s.name+'</b> ('+s.cls+')<br>Avg: '+a+' - <span class="grade-'+g+'">'+g+'</span><br>Math:'+s.math+' Eng:'+s.eng+' Sci:'+s.sci+'<br><button onclick="del('+i+')" style="width:auto;padding:2px 8px;background:rgba(248,81,73,.2);color:#f85149;font-size:10px">Remove</button></div>'}).join('');document.getElementById('students').innerHTML=html||'<p style="color:#8b949e">No students yet</p>';if(students.length){var avgAll=Math.round(students.reduce((s,st)=>s+avg(st.math,st.eng,st.sci),0)/students.length);document.getElementById('stats').innerHTML='<p>Total: '+students.length+' | Class Avg: '+avgAll+' | Top: '+Math.max(...students.map(s=>avg(s.math,s.eng,st.sci)))+'</p>'}else{document.getElementById('stats').innerHTML='<p style="color:#8b949e">Add students to see stats</p>'}}function addStudent(){var n=document.getElementById('sn').value;if(!n)return;students.push({name:n,cls:document.getElementById('sc').value,math:+document.getElementById('sm').value||0,eng:+document.getElementById('se').value||0,sci:+document.getElementById('ss').value||0});localStorage.setItem('danfodioStudents',JSON.stringify(students));document.getElementById('sn').value='';document.getElementById('sm').value='';document.getElementById('se').value='';document.getElementById('ss').value='';render()}function del(i){students.splice(i,1);localStorage.setItem('danfodioStudents',JSON.stringify(students));render()}render()</script></body></html>
