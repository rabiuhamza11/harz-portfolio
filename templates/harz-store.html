<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HarzDM Marketplace</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:12px;max-width:600px;margin:0 auto}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin-bottom:10px}.card h2{color:#58a6ff;font-size:14px;margin-bottom:8px}input,button{background:#1c2333;border:1px solid #30363d;border-radius:8px;padding:8px;color:#e6edf3;margin:4px 0;width:100%}button{background:#3fb950;color:#000;font-weight:700;cursor:pointer}.product{background:#1c2333;border-radius:8px;padding:12px;margin:4px 0;display:flex;align-items:center;gap:10px}.price{color:#3fb950;font-weight:700}.cat-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;background:rgba(88,166,255,.15);color:#58a6ff}</style></head><body><div class="card"><h2>&#128722; HarzDM Marketplace</h2><p style="color:#8b949e;font-size:12px">Product listings & checkout</p></div><div class="card"><h2>List Product</h2><input id="pn" placeholder="Product name"><input id="pp" type="number" placeholder="Price (&#8358;)"><input id="pc" placeholder="Category"><button onclick="addProduct()">List Product</button></div><div class="card"><h2>Products</h2><div id="products"></div></div><script>var products=JSON.parse(localStorage.getItem('harzProducts')||'[{"name":"HARZ Construction Kit","price":50000,"cat":"Tools"},{"name":"BuildBot AI License","price":25000,"cat":"Software"},{"name":"Farm Manager Pro","price":15000,"cat":"Software"},{"name":"School Portal Premium","price":30000,"cat":"Software"}]');function render(){document.getElementById('products').innerHTML=products.map((p,i)=>'<div class="product"><div style="flex:1"><b>'+p.name+'</b><br><span class="cat-badge">'+p.cat+'</span><br><span class="price">&#8358;'+p.price.toLocaleString()+'</span></div><button onclick="buy('+i+')" style="width:auto;padding:6px 12px">Buy</button></div>').join('')}function addProduct(){var n=document.getElementById('pn').value;if(!n)return;products.push({name:n,price:+document.getElementById('pp').value||0,cat:document.getElementById('pc').value||'General'});localStorage.setItem('harzProducts',JSON.stringify(products));document.getElementById('pn').value='';document.getElementById('pp').value='';document.getElementById('pc').value='';render()}function buy(i){alert('Checkout: '+products[i].name+' - \\u20A6'+products[i].price.toLocaleString()+'\\n\\nPayment: Paystack, Bank Transfer, USDT')}render()</script></body></html>
