<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HARZ Farm Manager</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:12px;max-width:600px;margin:0 auto}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin-bottom:10px}.card h2{color:#58a6ff;font-size:14px;margin-bottom:8px}input,select,button{background:#1c2333;border:1px solid #30363d;border-radius:8px;padding:8px;color:#e6edf3;margin:4px 0;width:100%}button{background:#3fb950;color:#000;font-weight:700;cursor:pointer}.item{background:#1c2333;border-radius:8px;padding:10px;margin:4px 0}.bar{height:6px;background:#30363d;border-radius:3px;margin-top:4px}.bar-fill{height:100%;background:#3fb950;border-radius:3px}</style></head><body><div class="card"><h2>&#127806; HARZ Farm Manager</h2><p style="color:#8b949e;font-size:12px">Crop tracking, livestock & expenses</p></div><div class="card"><h2>Add Crop</h2><input id="cn" placeholder="Crop name (e.g. Maize)"><input id="ca" type="number" placeholder="Acres"><select id="cs"><option>Planted</option><option>Growing</option><option>Ready</option><option>Harvested</option></select><button onclick="addCrop()">Add Crop</button></div><div class="card"><h2>Active Crops</h2><div id="crops"></div></div><div class="card"><h2>Add Expense</h2><input id="ed" placeholder="Description (seeds, fertilizer...)"><input id="ea" type="number" placeholder="Amount (&#8358;)"><button onclick="addExpense()">Add Expense</button><div id="expenses" style="margin-top:8px"></div></div><script>var crops=JSON.parse(localStorage.getItem('harzCrops')||'[{"name":"Maize","acres":5,"status":"Growing"},{"name":"Tomatoes","acres":2,"status":"Ready"},{"name":"Cassava","acres":10,"status":"Planted"}]');var expenses=JSON.parse(localStorage.getItem('harzFarmExpenses')||'[]');function render(){document.getElementById('crops').innerHTML=crops.map((c,i)=>{var p=c.status==='Harvested'?100:c.status==='Ready'?90:c.status==='Growing'?50:10;return '<div class="item"><b>'+c.name+'</b> - '+c.acres+' acres ('+c.status+')<div class="bar"><div class="bar-fill" style="width:'+p+'%"></div></div></div>'}).join('')||'<p style="color:#8b949e">No crops</p>';var total=expenses.reduce((s,e)=>s+e.amount,0);document.getElementById('expenses').innerHTML=expenses.map(e=>'<div class="item">'+e.desc+': &#8358;'+e.amount.toLocaleString()+'</div>').join('')+'<div class="item" style="border-color:#3fb950"><b>Total: &#8358;'+total.toLocaleString()+'</b></div>'}function addCrop(){if(!document.getElementById('cn').value)return;crops.push({name:document.getElementById('cn').value,acres:+document.getElementById('ca').value||1,status:document.getElementById('cs').value});localStorage.setItem('harzCrops',JSON.stringify(crops));document.getElementById('cn').value='';document.getElementById('ca').value='';render()}function addExpense(){var d=document.getElementById('ed').value;if(!d)return;expenses.push({desc:d,amount:+document.getElementById('ea').value||0});localStorage.setItem('harzFarmExpenses',JSON.stringify(expenses));document.getElementById('ed').value='';document.getElementById('ea').value='';render()}render()</script></body></html>
