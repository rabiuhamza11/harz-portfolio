<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARZ Ecosystem Status — Live Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0b14;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;padding:20px;background:linear-gradient(135deg,#0d1117,#161b22);border-radius:16px;border:1px solid #1f2937}
.header h1{font-size:24px;background:linear-gradient(135deg,#4ecdc4,#ff6b35);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .version{color:#4ecdc4;font-size:14px;font-weight:600}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:30px}
.stat-card{background:#0d1117;border:1px solid #1f2937;border-radius:12px;padding:20px}
.stat-card .label{color:#6b7280;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.stat-card .value{font-size:32px;font-weight:700;color:#fff}
.stat-card .icon{font-size:24px;float:right}
.stat-card.green .value{color:#4ade80}
.stat-card.blue .value{color:#60a5fa}
.stat-card.orange .value{color:#fb923c}
.stat-card.purple .value{color:#c084fc}
.section{background:#0d1117;border:1px solid #1f2937;border-radius:12px;padding:20px;margin-bottom:20px}
.section h2{font-size:18px;color:#4ecdc4;margin-bottom:16px}
.platform-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.platform-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#161b22;border-radius:8px;border:1px solid #1f2937}
.platform-item .name{font-weight:600}
.platform-item .status-dot{width:10px;height:10px;border-radius:50%;margin-left:12px}
.status-dot.live{background:#4ade80;box-shadow:0 0 8px #4ade80}
.status-dot.down{background:#ef4444;box-shadow:0 0 8px #ef4444}
.platform-item .url{color:#6b7280;font-size:12px;text-decoration:none;margin-top:4px;display:block}
.wallet-bar{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px}
.wallet-item{background:#161b22;padding:12px 20px;border-radius:8px;border:1px solid #1f2937}
.wallet-item .cur{color:#6b7280;font-size:12px}
.wallet-item .amt{font-size:20px;font-weight:700;color:#4ade80}
.footer{text-align:center;color:#374151;font-size:12px;margin-top:30px;padding:20px}
.refresh-btn{background:#4ecdc4;color:#0a0b14;border:none;padding:8px 20px;border-radius:8px;font-weight:600;cursor:pointer}
.refresh-btn:hover{background:#3bb5ad}
</style>
</head>
<body>

<div class="header">
<div>
<h1>HARZ Ecosystem Status</h1>
<div class="version" id="version">Loading...</div>
</div>
<div>
<button class="refresh-btn" onclick="loadData()">Refresh</button>
</div>
</div>

<div class="stats-grid" id="stats"></div>

<div class="section">
<h2>Wallet Balance</h2>
<div class="wallet-bar" id="wallet"></div>
</div>

<div class="section">
<h2>Platforms (30)</h2>
<div class="platform-list" id="platforms"></div>
</div>

<div class="section">
<h2>AI Agents (7)</h2>
<div class="platform-list" id="agents"></div>
</div>

<div class="footer">
HARZ Cloud v20.0 — The Vercel of Africa<br>
Live data from HARZ Cloud API + Cloudflare Edge Worker<br>
Last checked: <span id="last-check">--</span>
</div>

<script>
const API = "https://harz-cloud-backend.onrender.com";
const EDGE = "https://harz-edge-proxy.harz.workers.dev";
const KEY = "harz_cloud_live_321424";

async function loadData() {
try {
// Load from edge worker first (fastest)
const edgeRes = await fetch(EDGE + "/health");
const edge = await edgeRes.json();

document.getElementById("version").textContent = "v" + edge.version + " | Updated: " + (edge.last_updated||"").substring(0,16).replace("T"," ");

document.getElementById("stats").innerHTML = `
<div class="stat-card green"><div class="icon">☁️</div><div class="label">Platforms</div><div class="value">${edge.total_platforms||30}</div></div>
<div class="stat-card blue"><div class="icon">📦</div><div class="label">Repositories</div><div class="value">${edge.total_repos||66}</div></div>
<div class="stat-card purple"><div class="icon">🤖</div><div class="label">AI Agents</div><div class="value">${edge.total_agents||7}</div></div>
<div class="stat-card orange"><div class="icon">🔌</div><div class="label">API Endpoints</div><div class="value">${edge.total_endpoints||292}</div></div>
`;

document.getElementById("wallet").innerHTML = `
<div class="wallet-item"><div class="cur">NGN</div><div class="amt">₦${(edge.wallet_ngn||0).toLocaleString()}</div></div>
<div class="wallet-item"><div class="cur">USD</div><div class="amt">$${(edge.wallet_usd||0).toLocaleString()}</div></div>
`;

// Load platforms from API
try {
const pRes = await fetch(API + "/api/Platform", {headers: {"x-api-key": KEY}});
const pData = await pRes.json();
const platforms = pData.records || pData;
document.getElementById("platforms").innerHTML = platforms.map(p => `
<div class="platform-item">
<div>
<div class="name">${p.icon||""} ${p.name}</div>
<a class="url" href="${p.url||"#"}" target="_blank">${p.url||""}</a>
</div>
<div class="status-dot live"></div>
</div>
`).join("");
} catch(e) {
document.getElementById("platforms").innerHTML = "<p>Loading from edge cache...</p>";
}

// Load agents
try {
const aRes = await fetch(API + "/api/Agent", {headers: {"x-api-key": KEY}});
const aData = await aRes.json();
const agents = aData.records || aData;
document.getElementById("agents").innerHTML = agents.map(a => `
<div class="platform-item">
<div>
<div class="name">${a.icon||"🤖"} ${a.name}</div>
<div class="url">${a.role||""} | ${a.tasks_completed||0} tasks | ${a.success_rate||0}%</div>
</div>
<div class="status-dot live"></div>
</div>
`).join("");
} catch(e) {
document.getElementById("agents").innerHTML = "<p>Loading from edge cache...</p>";
}

document.getElementById("last-check").textContent = new Date().toLocaleString();
} catch(e) {
document.getElementById("version").textContent = "Connection error - retrying...";
console.error(e);
}
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
