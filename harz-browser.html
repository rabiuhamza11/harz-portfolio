*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2333;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--green:#3fb950;--blue:#58a6ff;--purple:#bc8cff;--gold:#FFD700;--red:#f85149;--orange:#d29922;--radius:12px}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.tabs-bar{display:flex;gap:4px;padding:4px 10px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
.tab-item{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:4px;max-width:140px}
.tab-item.active{background:var(--bg);border-color:var(--blue)}
.tab-item .tab-close{color:var(--dim);font-size:14px;margin-left:2px}
.tab-item .tab-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.new-tab-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--dim);width:28px;height:28px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:6px 10px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-btn:active{opacity:.6}
.addr-bar{flex:1;display:flex;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;gap:6px;min-width:0}
.addr-bar input{flex:1;background:none;border:none;color:var(--text);font-size:13px;outline:none;min-width:0}
.addr-bar input::placeholder{color:var(--dim)}
.secure-icon{font-size:12px;flex-shrink:0}
.menu-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bookmark-bar{display:flex;gap:6px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
.bm-item{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:4px 10px;font-size:11px;white-space:nowrap;cursor:pointer;color:var(--text)}
.bm-item:active{opacity:.7}
.content{flex:1;position:relative;overflow:hidden;background:#fff}
.content iframe{width:100%;height:100%;border:none;background:#fff}
.start-page{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:16px}
.loading-bar{position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue);transform-origin:left;animation:loading 1.5s ease-in-out infinite;z-index:100}
@keyframes loading{0%{transform:scaleX(0)}50%{transform:scaleX(.7)}100%{transform:scaleX(1)}}
.hidden{display:none!important}
.search-grid{max-width:600px;margin:0 auto}
.logo{text-align:center;padding:20px 0 16px}
.logo-icon{font-size:40px}
.logo-title{font-size:22px;font-weight:800;margin-top:4px;background:linear-gradient(135deg,var(--blue),var(--purple),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:11px;color:var(--dim);margin-top:2px}
.search-box{display:flex;gap:8px;margin-bottom:16px}
.search-box input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:12px 16px;color:var(--text);font-size:14px;outline:none}
.search-box input:focus{border-color:var(--blue)}
.search-box button{background:var(--blue);color:#000;border:none;border-radius:50%;width:46px;height:46px;font-size:18px;cursor:pointer;flex-shrink:0}
.quick-section{margin-bottom:16px}
.quick-title{font-size:11px;color:var(--dim);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:4px}
.quick-item:active{opacity:.7;transform:scale(.95)}
.quick-icon{font-size:24px}
.quick-name{font-size:10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.error-page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:20px;text-align:center}
.error-page .err-icon{font-size:48px;margin-bottom:12px}
.error-page .err-title{font-size:18px;font-weight:700;margin-bottom:8px}
.error-page .err-msg{font-size:13px;color:var(--dim);margin-bottom:16px;max-width:400px;line-height:1.5}
.error-page .err-btn{background:var(--blue);color:#000;border:none;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.bottom-bar{display:flex;justify-content:space-around;padding:6px 10px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
.bb-btn{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:6px 10px;display:flex;align-items:center;justify-content:center}
.bb-btn:active{color:var(--blue)}
.menu-panel{position:absolute;top:80px;right:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;z-index:200;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu-item{padding:10px 12px;font-size:13px;cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:8px;color:var(--text)}
.menu-item:active{background:var(--card2)}
.menu-item .mi-icon{font-size:16px;width:20px;text-align:center}
.history-panel{position:fixed;inset:0;background:var(--bg);z-index:300;overflow:auto;padding:16px}
.history-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:10px}
.history-item:active{background:var(--card2)}
.history-item .h-icon{font-size:18px;flex-shrink:0;width:20px;text-align:center}
.history-item .h-info{flex:1;min-width:0}
.history-item .h-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .h-url{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .h-time{font-size:10px;color:var(--dim);flex-shrink:0}
</style>
</head>

function renderQuick(){
var harzHtml=harzLinks.map(function(l){return '<div class="quick-item" onclick="navigate(\''+l.url+'\')"><div class="quick-icon">'+l.icon+'</div><div class="quick-name">'+l.name+'</div></div>';}).join('');
document.getElementById('harzQuick').innerHTML=harzHtml;
var qlHtml=quickLinks.map(function(l){return '<div class="quick-item" onclick="navigate(\''+l.url+'\')"><div class="quick-icon">'+l.icon+'</div><div class="quick-name">'+l.name+'</div></div>';}).join('');
document.getElementById('quickLinks').innerHTML=qlHtml;
renderRecent();
}

function renderRecent(){
var h=browsingHistory.slice(0,6);
if(h.length===0){document.getElementById('recentSites').innerHTML='<p style="color:var(--dim);font-size:12px;padding:8px">No recent visits</p>';return;}
var html=h.map(function(item){
var icon=getFavicon(item.url);
return '<div class="history-item" onclick="navigate(\''+item.url+'\')"><div class="h-icon">'+icon+'</div><div class="h-info"><div class="h-title">'+item.title+'</div><div class="h-url">'+item.url+'</div></div><div class="h-time">'+item.time+'</div></div>';
}).join('');
document.getElementById('recentSites').innerHTML=html;
}

function getFavicon(url){
try{var u=new URL(url);return '<img src="https://www.google.com/s2/favicons?domain='+u.hostname+'&sz=32" style="width:18px;height:18px;border-radius:4px" onerror="this.outerHTML=\'🌐\'">';}catch(e){return '🌐';}
}

function doSearch(q){
q=q.trim();
if(!q)return;
if(q.startsWith('http://')||q.startsWith('https://')){navigate(q);return;}
if(q.includes('.')&&q.indexOf(' ')===-1){navigate('https://'+q);return;}
navigate('https://www.google.com/search?q='+encodeURIComponent(q));
}

function navigate(url,addToHistory){
if(!url||url==='about:blank'){showStart();return;}
currentUrl=url;
document.getElementById('startPage').classList.add('hidden');
document.getElementById('errorPage').classList.add('hidden');
document.getElementById('urlInput').value=url;
document.getElementById('secureIcon').textContent=url.startsWith('https://')?'🔒':'⚠';
document.getElementById('secureIcon').style.color=url.startsWith('https://')?'var(--green)':'var(--orange)';
var content=document.getElementById('content');
var old=content.querySelector('iframe');
if(old)old.remove();
var iframe=document.createElement('iframe');
iframe.setAttribute('referrerpolicy','no-referrer');
iframe.setAttribute('sandbox','allow-same-origin allow-scripts allow-popups allow-forms allow-popups-to-escape-sandbox');
iframe.onload=function(){
document.querySelector('.loading-bar')?.remove();
try{
var title=iframe.contentDocument?iframe.contentDocument.title:url;
addHistory(url,title);
updateTab(url,title);
}catch(e){
addHistory(url,url);
updateTab(url,url);
}
};
iframe.onerror=function(){showError(url);};
iframe.src=url;
content.appendChild(iframe);
var bar=document.createElement('div');
bar.className='loading-bar';
content.appendChild(bar);
setTimeout(function(){if(bar.parentNode)bar.remove();},3000);
if(addToHistory!==false){
history_stack.push(url);
forward_stack=[];
}
}

function showError(url){
document.getElementById('errorPage').classList.remove('hidden');
var hostname='this site';
try{hostname=new URL(url).hostname;}catch(e){}
document.getElementById('errMsg').textContent=hostname+' blocks embedding for security. Open it in a new tab instead.';
}

function openInNewTab(){
if(currentUrl)window.open(currentUrl,'_blank');
document.getElementById('menuPanel').classList.add('hidden');
}

function showStart(){
currentUrl='';
document.getElementById('startPage').classList.remove('hidden');
document.getElementById('errorPage').classList.add('hidden');
document.getElementById('urlInput').value='';
var iframe=document.querySelector('#content iframe');
if(iframe)iframe.remove();
var bar=document.querySelector('.loading-bar');
if(bar)bar.remove();
renderQuick();
}

function goBack(){
if(history_stack.length>1){
forward_stack.push(history_stack.pop());
navigate(history_stack[history_stack.length-1],false);
}else if(history_stack.length===1){
forward_stack.push(history_stack.pop());
showStart();
}
}

function goForward(){
if(forward_stack.length>0){
var url=forward_stack.pop();
history_stack.push(url);
navigate(url,false);
}
}

function reload(){
if(currentUrl){navigate(currentUrl,false);}
}

function goHome(){
showStart();
}

function toggleMenu(e){
if(e)e.stopPropagation();
document.getElementById('menuPanel').classList.toggle('hidden');
}

function addBookmark(){
if(currentUrl){
var title=prompt('Bookmark name:',currentUrl);
if(title){
bookmarks.unshift({url:currentUrl,title:title||currentUrl});
bookmarks=bookmarks.slice(0,50);
localStorage.setItem('harzBrowserBookmarks',JSON.stringify(bookmarks));
renderBookmarks();
}
}
document.getElementById('menuPanel').classList.add('hidden');
}

function renderBookmarks(){
var html=bookmarks.map(function(b){return '<span class="bm-item" onclick="navigate(\''+b.url+'\')">'+b.title+'</span>';}).join('');
document.getElementById('bookmarkBar').innerHTML=html||'<span style="color:var(--dim);font-size:11px;padding:4px 10px">⭐ Tap ⋮ to add bookmarks</span>';
}

function addHistory(url,title){
browsingHistory=browsingHistory.filter(function(h){return h.url!==url;});
browsingHistory.unshift({url:url,title:title,time:new Date().toLocaleString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})});
browsingHistory=browsingHistory.slice(0,100);
localStorage.setItem('harzBrowserHistory',JSON.stringify(browsingHistory));
}

function showHistory(){
var panel=document.createElement('div');
panel.className='history-panel';
panel.id='historyPanel';
var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b style="font-size:16px">🕐 History</b><button onclick="document.getElementById(\'historyPanel\').remove()" style="background:var(--card2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px">✕ Close</button></div>';
if(browsingHistory.length===0){
html+='<p style="color:var(--dim);font-size:13px;text-align:center;padding:20px">No history yet</p>';
}else{
html+=browsingHistory.map(function(h){
var icon=getFavicon(h.url);
return '<div class="history-item" onclick="document.getElementById(\'historyPanel\').remove();navigate(\''+h.url+'\')"><div class="h-icon">'+icon+'</div><div class="h-info"><div class="h-title">'+h.title+'</div><div class="h-url">'+h.url+'</div></div><div class="h-time">'+h.time+'</div></div>';
}).join('');
}
panel.innerHTML=html;
document.body.appendChild(panel);
}

function clearHistory(){
if(confirm('Clear all browsing history?')){
browsingHistory=[];
localStorage.setItem('harzBrowserHistory',JSON.stringify(browsingHistory));
alert('History cleared!');
}
document.getElementById('menuPanel').classList.add('hidden');
}

function sharePage(){
if(navigator.share&&currentUrl){
navigator.share({title:'HARZ Browser',url:currentUrl}).catch(function(){});
}else if(currentUrl){
alert('URL: '+currentUrl);
}
}

function newTab(){
tabs.push({url:'',title:'New Tab'});
activeTab=tabs.length-1;
renderTabs();
showStart();
}

function closeTab(i){
tabs.splice(i,1);
if(tabs.length===0){tabs=[{url:'',title:'New Tab'}];activeTab=0;}
if(activeTab>=tabs.length)activeTab=tabs.length-1;
renderTabs();
if(tabs[activeTab].url){navigate(tabs[activeTab].url,false);}else{showStart();}
}

function renderTabs(){
var html=tabs.map(function(t,i){
var cls=i===activeTab?'tab-item active':'tab-item';
var label=t.title||'New Tab';
if(label.length>15)label=label.substring(0,15)+'...';
return '<div class="'+cls+'" onclick="activeTab='+i+';if(tabs['+i+'].url){navigate(tabs['+i+'].url,false)}else{showStart()}"><span class="tab-label">'+label+'</span><span class="tab-close" onclick="event.stopPropagation();closeTab('+i+')">×</span></div>';
}).join('');
document.getElementById('tabsBar').innerHTML=html+'<div class="new-tab-btn" onclick="newTab()">+</div>';
}

function updateTab(url,title){
if(tabs[activeTab]){
tabs[activeTab].url=url;
tabs[activeTab].title=title||url;
renderTabs();
}
}

document.getElementById('urlInput').addEventListener('keydown',function(e){
if(e.key==='Enter'){
var val=this.value.trim();
if(val){doSearch(val);}
}
});

document.getElementById('searchInput').addEventListener('keydown',function(e){
if(e.key==='Enter'){doSearch(this.value);}
});

document.addEventListener('click',function(e){
var menu=document.getElementById('menuPanel');
if(!menu.contains(e.target)&&!e.target.closest('.menu-btn')){
menu.classList.add('hidden');
}
});

renderQuick();
renderBookmarks();
renderTabs();
</script>
