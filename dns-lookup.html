<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNS Lookup — HARZ Toolkit</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}.c{max-width:800px;margin:0 auto}h1{text-align:center;font-size:1.8rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}.sub{text-align:center;color:#94a3b8;margin-bottom:30px;font-size:.9rem}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;margin-bottom:20px}.card h2{font-size:1.1rem;margin-bottom:16px;color:#60a5fa}.fg{margin-bottom:14px}.fg label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:5px}.fg input{width:100%;padding:10px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:.9rem;font-family:monospace}.btn{padding:10px 20px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-size:.9rem}.types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.type-btn{padding:6px 12px;background:#334155;border-radius:6px;font-size:.8rem;cursor:pointer;color:#cbd5e1}.type-btn.active{background:#3b82f6;color:#fff}.result{margin-top:12px}.dns-row{display:flex;justify-content:space-between;padding:10px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;margin-bottom:6px;font-family:monospace;font-size:.85rem}.dns-row .name{color:#94a3b8}.dns-row .value{color:#a5b4fc}.dns-row .ttl{color:#64748b;font-size:.75rem}.status{padding:8px 12px;border-radius:6px;margin:8px 0;font-size:.85rem}.status.ok{background:#052e16;color:#4ade80}.status.err{background:#450a0a;color:#f87171}.status.pending{background:#1e3a5f;color:#93c5fd}</style>
</head>
<body>
<div class="c">
<h1>DNS Lookup Tool</h1><p class="sub">Query DNS records using Google Public DNS API</p>
<div class="card"><h2>Query</h2>
<div class="fg"><label>Domain Name</label><input id="domain" value="harz-cloud.pages.dev" onkeypress="if(event.key==='Enter')lookup()"></div>
<div class="types" id="types"></div>
<button class="btn" onclick="lookup()">Lookup</button>
</div>
<div class="card"><h2>Results</h2><div id="results"></div></div>
<div class="card"><h2>WHOIS Info</h2><div id="whois"></div><button class="btn" onclick="whoisLookup()" style="margin-top:10px">WHOIS Lookup</button></div>
</div>
<script>
const dnsTypes=['A','AAAA','CNAME','MX','TXT','NS','SOA','CAA','PTR','SRV'];
let activeType='A';
document.getElementById('types').innerHTML=dnsTypes.map(t=>'<span class="type-btn '+(t===activeType?'active':'')+'" onclick="setType(\''+t+'\')">'+t+'</span>').join('');
function setType(t){activeType=t;document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.textContent===t));}
async function lookup(){
const domain=document.getElementById('domain').value.trim();if(!domain)return;
document.getElementById('results').innerHTML='<div class="status pending">Querying '+activeType+' records for '+domain+'...</div>';
try{
const res=await fetch('https://dns.google/resolve?name='+domain+'&type='+activeType);
const data=await res.json();
if(data.Answer&&data.Answer.length){document.getElementById('results').innerHTML=data.Answer.map(a=>'<div class="dns-row"><span class="name">'+a.name+'</span><span class="value">'+a.data+'</span><span class="ttl">TTL: '+a.TTL+'s</span></div>').join('');}
else{document.getElementById('results').innerHTML='<div class="status err">No '+activeType+' records found for '+domain+'</div>';}
}catch(e){document.getElementById('results').innerHTML='<div class="status err">Error: '+e.message+'</div>';}}
async function whoisLookup(){
const domain=document.getElementById('domain').value.trim();if(!domain)return;
document.getElementById('whois').innerHTML='<div class="status pending">Fetching WHOIS...</div>';
try{
const res=await fetch('https://rdap.org/domain/'+domain);
if(res.ok){const data=await res.json();let info='';if(data.registrantName)info+='Registrant: '+data.registrantName+'\n';if(data.events)data.events.forEach(e=>info+=e.eventAction+': '+e.eventDate+'\n');if(data.nameservers)info+='Nameservers: '+data.nameservers.map(n=>n.ldhName).join(', ')+'\n';if(data.status)info+='Status: '+data.status.join(', ');document.getElementById('whois').innerHTML='<div class="status ok">WHOIS found</div><pre style="white-space:pre-wrap;font-family:monospace;font-size:.8rem;color:#a5b4fc;margin-top:8px">'+(info||JSON.stringify(data,null,2).slice(0,500))+'</pre>';}
else{document.getElementById('whois').innerHTML='<div class="status err">WHOIS not available for this domain (try whois.com)</div>';}
}catch(e){document.getElementById('whois').innerHTML='<div class="status err">Error: '+e.message+'</div>';}}
lookup();
</script>
</body></html>
