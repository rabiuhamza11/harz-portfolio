<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markdown to HTML — HARZ Toolkit</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}.c{max-width:900px;margin:0 auto}h1{text-align:center;font-size:1.8rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}.sub{text-align:center;color:#94a3b8;margin-bottom:30px;font-size:.9rem}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;margin-bottom:20px}.card h2{font-size:1.1rem;margin-bottom:16px;color:#60a5fa}textarea{width:100%;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:.85rem;font-family:monospace;min-height:200px;resize:vertical}textarea:focus{outline:none;border-color:#3b82f6}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:8px 16px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-size:.85rem}.btn.sec{background:#334155}.out{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:16px;color:#e2e8f0;max-height:400px;overflow-y:auto;line-height:1.6}.out h1{color:#fff;font-size:1.5rem;margin:10px 0}.out h2{color:#fff;font-size:1.3rem;margin:10px 0}.out h3{color:#60a5fa;font-size:1.1rem;margin:8px 0}.out p{margin:8px 0}.out code{background:#334155;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:.85rem;color:#fbbf24}.out pre{background:#1e293b;padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}.out pre code{background:none;padding:0;color:#a5b4fc}.out ul{margin:8px 0;padding-left:20px}.out li{margin:4px 0}.out a{color:#60a5fa;text-decoration:underline}.out blockquote{border-left:3px solid #3b82f6;padding-left:12px;margin:8px 0;color:#94a3b8}.out table{border-collapse:collapse;margin:8px 0}.out th,.out td{border:1px solid #334155;padding:6px 12px}.out th{background:#334155}.raw{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;font-family:monospace;font-size:.8rem;color:#a5b4fc;max-height:400px;overflow-y:auto;white-space:pre-wrap}</style>
</head>
<body>
<div class="c">
<h1>Markdown to HTML Converter</h1><p class="sub">Convert Markdown to HTML with live preview</p>
<div class="card"><h2>Markdown Input</h2>
<textarea id="md" oninput="convert()" placeholder="Type Markdown here..."># HARZ Cloud

Welcome to the **HARZ AI Operating System**. This is a _fast_ converter.

## Features

1. Live preview
2. Code blocks
3. Tables

### Code Example

  return amount * 0.01;

Check out [HARZ Cloud](https://harz-cloud.pages.dev) for more.</textarea>
</div>
<div class="card"><h2>Live Preview</h2><div class="out" id="preview"></div></div>
<div class="card"><h2>HTML Output</h2>
<div class="btns"><button class="btn" onclick="copyHTML()">Copy HTML</button><button class="btn sec" onclick="copyText()">Copy Text</button></div>
<div class="raw" id="htmlOut" style="margin-top:12px"></div>
</div>
</div>
<script>
function convert(){const md=document.getElementById('md').value;let html=md;
html=html.replace(/```(\w*)\n([\s\S]*?)```/g,(m,lang,code)=>'<pre><code class="language-'+lang+'">'+esc(code.trim())+'</code></pre>');
html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>');
html=html.replace(/^## (.+)$/gm,'<h2>$1</h2>');
html=html.replace(/^# (.+)$/gm,'<h1>$1</h1>');
html=html.replace(/^\> (.+)$/gm,'<blockquote>$1</blockquote>');
html=html.replace(/\|(.+)\|/g,(m)=>{const cells=m.split('|').filter(c=>c.trim());if(cells.every(c=>/^[-:\s]+$/.test(c)))return'';return '<tr>'+cells.map(c=>'<td>'+c.trim()+'</td>').join('')+'</tr>';});
html=html.replace(/(<tr>[\s\S]*?<\/tr>)/g,(m)=>{if(m.includes('---'))return'';return m;});
html=html.replace(/(<tr>[\s\S]+<\/tr>)/g,m=>'<table>'+m.replace(/<tr>/g,'<tr>').replace(/<\/tr>/g,'</tr>')+'</table>');
html=html.replace(/^\d+\.\s(.+)$/gm,'<li>$1</li>');
html=html.replace(/^[-*]\s(.+)$/gm,'<li>$1</li>');
html=html.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
html=html.replace(/<\/ul>\s*<ul>/g,'');
html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
html=html.replace(/_(.+?)_/g,'<em>$1</em>');
html=html.replace(/`(.+?)`/g,'<code>$1</code>');
html=html.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>');
html=html.replace(/\n\n/g,'</p><p>');
html=html.split('</p><p>').map(p=>p.trim()).filter(p=>p&&!p.startsWith('<h')&&!p.startsWith('<pre')&&!p.startsWith('<ul')&&!p.startsWith('<table')&&!p.startsWith('<blockquote')).join('');
document.getElementById('preview').innerHTML=html;
document.getElementById('htmlOut').textContent=html;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyHTML(){navigator.clipboard.writeText(document.getElementById('preview').innerHTML);alert('HTML copied!');}
function copyText(){navigator.clipboard.writeText(document.getElementById('preview').innerText);alert('Text copied!');}
convert();
</script>
</body></html>
