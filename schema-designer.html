<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Database Schema Designer — HARZ Toolkit</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}.c{max-width:900px;margin:0 auto}h1{text-align:center;font-size:1.8rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}.sub{text-align:center;color:#94a3b8;margin-bottom:30px;font-size:.9rem}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;margin-bottom:20px}.card h2{font-size:1.1rem;margin-bottom:16px;color:#60a5fa}.fg{margin-bottom:14px}.fg label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:5px}.fg input,.fg select{width:100%;padding:8px 10px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:.85rem}.table-add{display:flex;gap:8px;margin-bottom:16px}.table-add input{flex:1}.btn{padding:8px 16px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-size:.85rem;white-space:nowrap}.btn.sec{background:#334155}.tbl{background:#0f172a;border:1px solid #334155;border-radius:8px;margin-bottom:12px;padding:16px}.tbl-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.tbl-name{font-weight:700;color:#60a5fa;font-size:.95rem}.field-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.field-row input{flex:1;padding:6px 8px;background:#1e293b;border:1px solid #334155;border-radius:4px;color:#e2e8f0;font-size:.8rem}.field-row select{padding:6px;background:#1e293b;border:1px solid #334155;border-radius:4px;color:#e2e8f0;font-size:.8rem;max-width:110px}.out{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;font-family:monospace;font-size:.8rem;color:#a5b4fc;max-height:500px;overflow-y:auto;white-space:pre-wrap}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;margin-left:4px}.badge.pk{background:#1e3a5f;color:#93c5fd}.badge.fk{background:#3b1d0e;color:#fbbf24}.badge.nn{background:#450a0a;color:#f87171}.del{background:none;border:none;color:#f87171;cursor:pointer;font-size:1rem;padding:4px}</style>
</head>
<body>
<div class="c">
<h1>Database Schema Designer</h1><p class="sub">Design database tables and generate SQL</p>
<div class="card"><h2>Tables</h2>
<div class="table-add"><input id="newTbl" placeholder="Table name (e.g. users)" onkeypress="if(event.key==='Enter')addTable()"><button class="btn" onclick="addTable()">Add Table</button></div>
<div id="tables"></div>
</div>
<div class="card"><h2>Export</h2>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
<button class="btn" onclick="exportSQL()">SQL (CREATE TABLE)</button>
<button class="btn sec" onclick="exportJSON()">JSON Schema</button>
<button class="btn sec" onclick="exportPrisma()">Prisma Schema</button>
<button class="btn sec" onclick="exportMongoose()">Mongoose</button>
</div>
<div class="out" id="output"></div>
</div>
</div>
<script>
let tables=[{name:'users',fields:[{name:'id',type:'INTEGER',pk:true,nn:true},{name:'email',type:'VARCHAR(255)',pk:false,nn:true},{name:'fullName',type:'VARCHAR(100)',pk:false,nn:false},{name:'createdAt',type:'TIMESTAMP',pk:false,nn:true}]},{name:'orders',fields:[{name:'id',type:'INTEGER',pk:true,nn:true},{name:'userId',type:'INTEGER',pk:false,nn:true,fk:'users.id'},{name:'amount',type:'DECIMAL(10,2)',pk:false,nn:true},{name:'status',type:'VARCHAR(20)',pk:false,nn:false}]}];
function addTable(){const name=document.getElementById('newTbl').value.trim();if(!name)return;tables.push({name,fields:[{name:'id',type:'INTEGER',pk:true,nn:true}]});document.getElementById('newTbl').value='';render();exportSQL();}
function deleteTable(i){tables.splice(i,1);render();exportSQL();}
function addField(i){tables[i].fields.push({name:'',type:'VARCHAR(255)',pk:false,nn:false});render();exportSQL();}
function deleteField(ti,fi){tables[ti].fields.splice(fi,1);render();exportSQL();}
function render(){document.getElementById('tables').innerHTML=tables.map((t,ti)=>'<div class="tbl"><div class="tbl-header"><span class="tbl-name">'+t.name+' ('+t.fields.length+' fields)</span><button class="del" onclick="deleteTable('+ti+')">Delete table</button></div>'+t.fields.map((f,fi)=>'<div class="field-row"><input value="'+f.name+'" placeholder="field name" oninput="tables['+ti+'].fields['+fi+'].name=this.value;exportSQL()"><select onchange="tables['+ti+'].fields['+fi+'].type=this.value;exportSQL()"><option value="INTEGER" '+(f.type==='INTEGER'?'selected':'')+'>INTEGER</option><option value="VARCHAR(255)" '+(f.type==='VARCHAR(255)'?'selected':'')+'>VARCHAR</option><option value="TEXT" '+(f.type==='TEXT'?'selected':'')+'>TEXT</option><option value="BOOLEAN" '+(f.type==='BOOLEAN'?'selected':'')+'>BOOLEAN</option><option value="DECIMAL(10,2)" '+(f.type==='DECIMAL(10,2)'?'selected':'')+'>DECIMAL</option><option value="TIMESTAMP" '+(f.type==='TIMESTAMP'?'selected':'')+'>TIMESTAMP</option><option value="JSON" '+(f.type==='JSON'?'selected':'')+'>JSON</option></select><label style="font-size:.75rem;display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" '+(f.pk?'checked':'')+' onchange="tables['+ti+'].fields['+fi+'].pk=this.checked;exportSQL()">PK</label><label style="font-size:.75rem;display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" '+(f.nn?'checked':'')+' onchange="tables['+ti+'].fields['+fi+'].nn=this.checked;exportSQL()">NN</label><button class="del" onclick="deleteField('+ti+','+fi+')">x</button></div>').join('')+'<button class="btn sec" onclick="addField('+ti+')" style="margin-top:6px;font-size:.8rem">+ Field</button></div>').join('');}
function exportSQL(){let sql='-- Generated by HARZ Toolkit\n\n';tables.forEach(t=>{sql+='CREATE TABLE '+t.name+' (\n';t.fields.forEach((f,i)=>{sql+='  '+f.name+' '+f.type;if(f.pk)sql+=' PRIMARY KEY';if(f.nn&&!f.pk)sql+=' NOT NULL';if(f.fk)sql+=',\n  FOREIGN KEY ('+f.name+') REFERENCES '+f.fk;if(i<t.fields.length-1)sql+=',';sql+='\n';});sql+=');\n\n';});document.getElementById('output').textContent=sql;}
function exportJSON(){document.getElementById('output').textContent=JSON.stringify(tables.map(t=>({name:t.name,fields:t.fields.map(f=>({name:f.name,type:f.type,primaryKey:f.pk,notNull:f.nn,foreignKey:f.fk||null}))})),null,2);}
function exportPrisma(){let s='// Prisma Schema\n';tables.forEach(t=>{s+='\nmodel '+t.name+' {\n';t.fields.forEach(f=>{const prismaType=f.type==='INTEGER'?'Int':f.type.startsWith('VARCHAR')?'String':f.type==='TEXT'?'String':f.type==='BOOLEAN'?'Boolean':f.type.startsWith('DECIMAL')?'Float':f.type==='TIMESTAMP'?'DateTime':f.type==='JSON'?'Json':'String';s+='  '+f.name+' '+prismaType;if(f.pk)s+=' @id @default(autoincrement())';if(f.nn&&!f.pk)s+=' @map("'+f.name+'")';s+='\n';});s+='}\n';});document.getElementById('output').textContent=s;}
function exportMongoose(){let s='// Mongoose Schemas\nconst mongoose = require("mongoose");\n\n';tables.forEach(t=>{s+='const '+t.name.charAt(0).toUpperCase()+t.name.slice(1)+'Schema = new mongoose.Schema({\n';t.fields.forEach(f=>{if(f.pk)return;const mType=f.type==='INTEGER'?'Number':f.type.startsWith('VARCHAR')||f.type==='TEXT'?'String':f.type==='BOOLEAN'?'Boolean':f.type.startsWith('DECIMAL')?'Number':f.type==='TIMESTAMP'?'Date':f.type==='JSON'?'Object':'String';s+='  '+f.name+': { type: '+mType+(f.nn?', required: true':'')+' },\n';});s+='}, { timestamps: true });\n\nmodule.exports = mongoose.model("'+t.name.charAt(0).toUpperCase()+t.name.slice(1)+'", '+t.name.charAt(0).toUpperCase()+t.name.slice(1)+'Schema);\n\n';});document.getElementById('output').textContent=s;}
render();exportSQL();
</script>
</body></html>
