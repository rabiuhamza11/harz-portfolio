<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Generator — HARZ Toolkit</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}.c{max-width:800px;margin:0 auto}h1{text-align:center;font-size:1.8rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}.sub{text-align:center;color:#94a3b8;margin-bottom:30px;font-size:.9rem}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;margin-bottom:20px}.card h2{font-size:1.1rem;margin-bottom:16px;color:#60a5fa}textarea{width:100%;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:.85rem;font-family:monospace;min-height:120px;resize:vertical}textarea:focus{outline:none;border-color:#3b82f6}.fg{margin-bottom:14px}.fg label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:5px}.fg input,.fg select{width:100%;padding:8px 10px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:.85rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:10px 20px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-size:.9rem}.btn.sec{background:#334155}.preview{background:#fff;color:#1e293b;border-radius:8px;padding:40px;min-height:300px;margin-top:12px;font-family:Georgia,serif}.preview h1{font-size:1.5rem;border-bottom:2px solid #1e293b;padding-bottom:8px}.preview h2{font-size:1.2rem;margin-top:16px}.preview p{margin:8px 0;line-height:1.6}</style>
</head>
<body>
<div class="c">
<h1>PDF Generator</h1><p class="sub">Generate PDFs from text and HTML in the browser</p>
<div class="card"><h2>Content</h2>
<div class="fg"><label>Title</label><input id="title" value="HARZ Invoice" oninput="render()"></div>
<div class="fg"><label>Content (HTML supported)</label><textarea id="content" oninput="render()" rows="8"><h1>HARZ Cloud Invoice</h1>
<p>Bill To: Rabiu Hamza</p>
<p>Date: August 6, 2026</p>
<h2>Items</h2>
<p>1. Cloud AI Subscription — $29/month<br>2. Domain Registration — $12/year</p>
<p>Total: $41.00</p>
<p style="text-align:center;font-size:0.8rem;color:gray">Generated by HARZ Toolkit</p></textarea></div>
<div class="row"><div class="fg"><label>Page Size</label><select id="pageSize" onchange="render()"><option value="a4">A4</option><option value="letter">Letter</option><option value="legal">Legal</option></select></div><div class="fg"><label>Orientation</label><select id="orientation" onchange="render()"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div></div>
</div>
<div class="card"><h2>Preview</h2><div class="preview" id="preview"></div>
<button class="btn" onclick="generatePDF()" style="margin-top:12px">Download PDF</button>
<button class="btn sec" onclick="printPDF()" style="margin-top:12px">Print / Save as PDF</button></div>
</div>
<script>
function render(){document.getElementById('preview').innerHTML=document.getElementById('content').value;}
function generatePDF(){const title=document.getElementById('title').value;const content=document.getElementById('content').value;const w=window.open('','_blank');w.document.write('<html><head><title>'+title+'</title><style>@page{size:'+document.getElementById('pageSize').value+' '+document.getElementById('orientation').value+';margin:1in}body{font-family:Georgia,serif}</style></head><body>'+content+'<script>window.onload=function(){window.print()}<\/script></body></html>');w.document.close();}
function printPDF(){render();window.print();}
render();
</script>
</body></html>
