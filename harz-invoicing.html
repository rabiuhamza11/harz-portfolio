<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARZ Invoicing</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--p1:#7c4dff;--p2:#5362f6;--p3:#00d4aa;--paid:#22c55e;--pending:#f59e0b;--overdue:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:70px}
.header{position:sticky;top:0;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;border-bottom:1px solid var(--border)}
.header h1{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-row{display:flex;gap:8px;padding:12px 16px}
.stat-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat-card .stat-num{font-size:1.1rem;font-weight:700}
.stat-card .stat-lbl{font-size:.58rem;color:var(--muted);text-transform:uppercase;margin-top:2px}
.filter-tabs{display:flex;gap:6px;padding:0 16px;margin-bottom:10px;overflow-x:auto}
.filter-tab{padding:6px 14px;border-radius:20px;font-size:.72rem;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--border);cursor:pointer}
.filter-tab.active{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent;color:#fff}
.inv-list{padding:0 16px}
.inv-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;transition:.2s}
.inv-card:active{transform:scale(.98)}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.inv-num{font-size:.78rem;font-weight:700;color:var(--p1)}
.inv-status{padding:2px 8px;border-radius:10px;font-size:.62rem;font-weight:700;text-transform:uppercase}
.inv-status.paid{background:rgba(34,197,94,.15);color:var(--paid)}
.inv-status.pending{background:rgba(245,158,11,.15);color:var(--pending)}
.inv-status.overdue{background:rgba(239,68,68,.15);color:var(--overdue)}
.inv-client{font-size:.88rem;font-weight:600;margin-bottom:4px}
.inv-detail{font-size:.72rem;color:var(--muted)}
.inv-amount{font-size:1.1rem;font-weight:700;margin-top:6px}
.inv-type{font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:var(--p3);font-weight:600}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:1.1rem;margin-bottom:14px}
.form-group{margin-bottom:10px}
.form-label{font-size:.72rem;color:var(--muted);margin-bottom:4px;display:block}
.form-input,.form-select,.form-textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-size:.85rem;font-family:inherit}
.form-input:focus{outline:none;border-color:var(--p1)}
.item-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.item-row input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:.82rem}
.item-row .amt{max-width:90px}
.item-del{width:30px;height:30px;border-radius:6px;background:rgba(239,68,68,.12);color:#ef4444;border:none;cursor:pointer;font-size:1rem;flex-shrink:0}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:10px;font-size:.85rem;font-weight:600;border:none;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.btn-cancel{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.fab{position:fixed;bottom:16px;right:16px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p2));border:none;color:#fff;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 20px rgba(124,77,255,.4);z-index:90;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:20px;font-size:.78rem;z-index:400;opacity:0;transition:.3s}
.toast.show{opacity:1;bottom:90px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .emoji{font-size:2.5rem;margin-bottom:8px}
</style>
</head>
<body>
<div class="header"><h1>🧾 HARZ Invoicing</h1></div>
<div class="stat-row">
<div class="stat-card"><div class="stat-num" id="stTotal">₦0</div><div class="stat-lbl">Total</div></div>
<div class="stat-card"><div class="stat-num" id="stPaid" style="color:var(--paid)">₦0</div><div class="stat-lbl">Paid</div></div>
<div class="stat-card"><div class="stat-num" id="stPending" style="color:var(--pending)">₦0</div><div class="stat-lbl">Pending</div></div>
<div class="stat-card"><div class="stat-num" id="stCount">0</div><div class="stat-lbl">Invoices</div></div>
</div>
<div class="filter-tabs" id="filterTabs">
<div class="filter-tab active" onclick="setFilter('all')">All</div>
<div class="filter-tab" onclick="setFilter('paid')">Paid</div>
<div class="filter-tab" onclick="setFilter('pending')">Pending</div>
<div class="filter-tab" onclick="setFilter('overdue')">Overdue</div>
</div>
<div class="inv-list" id="invList"></div>
<button class="fab" onclick="openModal()">+</button>
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h2 id="modalTitle">New Invoice</h2>
<div class="form-group"><label class="form-label">Client Name</label><input class="form-input" id="iClient" placeholder="Client / Company"></div>
<div class="form-row" style="display:flex;gap:8px">
<div class="form-group" style="flex:1"><label class="form-label">Type</label>
<select class="form-select" id="iType">
<option value="school">🏫 School Fees</option>
<option value="construction">🏗️ Construction</option>
<option value="farm">🌾 Farm Produce</option>
<option value="product">🛍️ Products</option>
<option value="service">💼 Service</option>
</select></div>
<div class="form-group" style="flex:1"><label class="form-label">Date</label><input type="date" class="form-input" id="iDate"></div>
</div>
<div class="form-group"><label class="form-label">Items</label><div id="itemList"></div>
<button class="btn btn-cancel" style="margin-top:6px;padding:6px 12px;font-size:.72rem" onclick="addItem()">+ Add Item</button></div>
<div class="form-group"><label class="form-label">Notes</label><input class="form-input" id="iNotes" placeholder="Payment terms, due date, etc."></div>
<div class="form-group"><label class="form-label">Status</label>
<select class="form-select" id="iStatus"><option value="pending">Pending</option><option value="paid">Paid</option><option value="overdue">Overdue</option></select></div>
<div class="modal-actions"><button class="btn btn-cancel" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveInvoice()">Save Invoice</button></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
let invoices=[],activeFilter='all',editingId=null,itemCount=0;
const typeLabels={school:'School',construction:'Construction',farm:'Farm',product:'Products',service:'Service'};
function load(){try{invoices=JSON.parse(localStorage.getItem('harz_invoices')||'[]')}catch(e){invoices=[]}}
function save(){localStorage.setItem('harz_invoices',JSON.stringify(invoices))}
function seed(){
if(invoices.length>0)return;
const today=new Date();
const s=[
{client:'Malam Musa Bello',type:'school',date:fmt(today),items:[{desc:'JSS2 Tuition (Term 3)',qty:1,price:75000},{desc:'PTA Levy',qty:1,price:5000}],notes:'Due in 2 weeks',status:'paid'},
{client:'Engr. Sani Garba',type:'construction',date:fmt(today),items:[{desc:'Foundation work — Wuse duplex',qty:1,price:450000},{desc:'Cement (200 bags)',qty:200,price:7500}],notes:'50% advance paid',status:'pending'},
{client:'Alhaji Tanko Ibrahim',type:'farm',date:fmt(today),items:[{desc:'Tomatoes (crates)',qty:50,price:4500}],notes:'Delivered to Wuse market',status:'paid'},
{client:'Mrs. Grace Okoro',type:'construction',date:fmt(today),items:[{desc:'Gwarimpa renovation',qty:1,price:280000}],notes:'Overdue — 15 days',status:'overdue'},
{client:'HarzDM Customer',type:'product',date:fmt(today),items:[{desc:'AI Agency Starter Kit',qty:1,price:25000},{desc:'Dev Platform Access (1yr)',qty:1,price:15000}],notes:'Online order',status:'pending'}
];
s.forEach((inv,i)=>{inv.id=Math.random().toString(36).substr(2,9);inv.number='INV-'+String(1001+i);invoices.push(inv)});
save();
}
function fmt(d){return d.toISOString().split('T')[0]}
function calcTotal(inv){return inv.items.reduce((s,i)=>s+(i.qty*i.price),0)}
function naira(n){return '₦'+n.toLocaleString('en-NG')}
function render(){
const filtered=activeFilter==='all'?invoices:invoices.filter(i=>i.status===activeFilter);
const total=invoices.reduce((s,i)=>s+calcTotal(i),0);
const paid=invoices.filter(i=>i.status==='paid').reduce((s,i)=>s+calcTotal(i),0);
const pending=invoices.filter(i=>i.status!=='paid').reduce((s,i)=>s+calcTotal(i),0);
document.getElementById('stTotal').textContent=naira(total);
document.getElementById('stPaid').textContent=naira(paid);
document.getElementById('stPending').textContent=naira(pending);
document.getElementById('stCount').textContent=invoices.length;
document.querySelectorAll('.filter-tab').forEach((t,i)=>t.classList.toggle('active',['all','paid','pending','overdue'][i]===activeFilter));
const list=document.getElementById('invList');
if(filtered.length===0){list.innerHTML='<div class="empty"><div class="emoji">🧾</div><p>No invoices. Tap + to create.</p></div>';return}
list.innerHTML=filtered.sort((a,b)=>b.number.localeCompare(a.number)).map(inv=>{
const total=calcTotal(inv);
return `<div class="inv-card" onclick="editInvoice('${inv.id}')">
<div class="inv-top"><span class="inv-num">${inv.number}</span><span class="inv-status ${inv.status}">${inv.status}</span></div>
<div class="inv-client">${esc(inv.client)}</div>
<div class="inv-detail">${inv.items.length} item(s) · ${fmt(new Date(inv.date))}</div>
<div class="inv-amount">${naira(total)}</div>
<div class="inv-type">${typeLabels[inv.type]}</div>
</div>`}).join('');
}
function setFilter(f){activeFilter=f;render()}
function addItem(desc='',qty=1,price=0){
itemCount++;
const div=document.createElement('div');
div.className='item-row';
div.id='item-'+itemCount;
div.innerHTML=`<input placeholder="Description" value="${esc(desc)}"><input type="number" class="amt" placeholder="Qty" value="${qty}"><input type="number" class="amt" placeholder="₦ Price" value="${price}"><button class="item-del" onclick="this.parentElement.remove()">×</button>`;
document.getElementById('itemList').appendChild(div);
}
function openModal(){
editingId=null;itemCount=0;
document.getElementById('modalTitle').textContent='New Invoice';
document.getElementById('iClient').value='';
document.getElementById('iType').value='school';
document.getElementById('iDate').value=fmt(new Date());
document.getElementById('iNotes').value='';
document.getElementById('iStatus').value='pending';
document.getElementById('itemList').innerHTML='';
addItem();
document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
function editInvoice(id){
const inv=invoices.find(i=>i.id===id);if(!inv)return;
editingId=id;itemCount=0;
document.getElementById('modalTitle').textContent='Edit Invoice';
document.getElementById('iClient').value=inv.client;
document.getElementById('iType').value=inv.type;
document.getElementById('iDate').value=inv.date;
document.getElementById('iNotes').value=inv.notes||'';
document.getElementById('iStatus').value=inv.status;
document.getElementById('itemList').innerHTML='';
inv.items.forEach(it=>addItem(it.desc,it.qty,it.price));
document.getElementById('modalOverlay').classList.add('show');
}
function saveInvoice(){
const client=document.getElementById('iClient').value.trim();
if(!client){showToast('Enter client name');return}
const items=[];
document.querySelectorAll('.item-row').forEach(row=>{
const inputs=row.querySelectorAll('input');
if(inputs[0].value.trim())items.push({desc:inputs[0].value.trim(),qty:parseInt(inputs[1].value)||1,price:parseInt(inputs[2].value)||0});
});
if(items.length===0){showToast('Add at least one item');return}
const data={client,type:document.getElementById('iType').value,date:document.getElementById('iDate').value,items,notes:document.getElementById('iNotes').value.trim(),status:document.getElementById('iStatus').value};
if(editingId){const inv=invoices.find(i=>i.id===editingId);Object.assign(inv,data)}else{data.id=Math.random().toString(36).substr(2,9);data.number='INV-'+String(1001+invoices.length);invoices.push(data)}
save();closeModal();render();showToast('Invoice saved ✓');
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
load();seed();render();
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal()});
</script>
</body>
</html>
