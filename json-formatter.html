<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Formatter — HARZ Toolkit</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}.c{max-width:900px;margin:0 auto}h1{text-align:center;font-size:1.8rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}.sub{text-align:center;color:#94a3b8;margin-bottom:30px;font-size:.9rem}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;margin-bottom:20px}.card h2{font-size:1.1rem;margin-bottom:16px;color:#60a5fa}textarea{width:100%;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:.85rem;font-family:monospace;min-height:200px;resize:vertical}textarea:focus{outline:none;border-color:#3b82f6}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:8px 16px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-size:.85rem}.btn.sec{background:#334155}.out{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;font-family:monospace;font-size:.85rem;color:#a5b4fc;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}.stat{display:inline-block;padding:4px 12px;background:#1e3a5f;border-radius:6px;font-size:.8rem;color:#93c5fd;margin:2px}.err{color:#f87171}</style>
</head>
<body>
<div class="c">
<h1>JSON Formatter & Validator</h1><p class="sub">Format, validate, minify, and convert JSON</p>
<div class="card"><h2>Input</h2><textarea id="input" placeholder="Paste JSON here...">{"name":"HARZ","version":"10.0","tools":["payments","AI","cloud"],"config":{"port":3000,"ssl":true,"features":["auth","wallet","analytics"]},"nested":{"deep":{"value":42}}}</textarea>
<div class="btns">
<button class="btn" onclick="format()">Format</button>
<button class="btn sec" onclick="minify()">Minify</button>
<button class="btn sec" onclick="validate()">Validate</button>
<button class="btn sec" onclick="toCSV()">To CSV</button>
<button class="btn sec" onclick="toYAML()">To YAML</button>
<button class="btn sec" onclick="beautify()">Beautify (2-space)</button>
<button class="btn sec" onclick="copyOut()">Copy Output</button>
</div></div>
<div class="card"><h2>Output</h2><div class="out" id="output"></div></div>
<div class="card"><h2>Stats</h2><div id="stats"></div></div>
</div>
<script>
function parseInput(){try{return JSON.parse(document.getElementById('input').value);}catch(e){return{error:e.message};}}
function format(){const d=parseInput();if(d.error){showErr(d.error);return;}document.getElementById('output').textContent=JSON.stringify(d,null,2);showStats(d);}
function minify(){const d=parseInput();if(d.error){showErr(d.error);return;}document.getElementById('output').textContent=JSON.stringify(d);showStats(d);}
function validate(){const d=parseInput();if(d.error){showErr(d.error);return;}document.getElementById('output').innerHTML='<span style="color:#4ade80">Valid JSON ✓</span>';showStats(d);}
function beautify(){const d=parseInput();if(d.error){showErr(d.error);return;}document.getElementById('output').textContent=JSON.stringify(d,null,'  ');showStats(d);}
function toCSV(){const d=parseInput();if(d.error){showErr(d.error);return;}if(!Array.isArray(d)){document.getElementById('output').textContent='CSV conversion requires an array of objects';return;}if(!d.length){document.getElementById('output').textContent='Empty array';return;}const keys=Object.keys(d[0]);const rows=d.map(o=>keys.map(k=>JSON.stringify(o[k]??'')).join(','));document.getElementById('output').textContent=keys.join(',')+'\n'+rows.join('\n');}
function toYAML(){const d=parseInput();if(d.error){showErr(d.error);return;}document.getElementById('output').textContent=objToYAML(d,0);}
function objToYAML(obj,indent){let y='';const sp=' '.repeat(indent);if(Array.isArray(obj)){obj.forEach(v=>{y+=sp+'- '+yamlVal(v,indent+2)+'\n';});}else if(typeof obj==='object'&&obj!==null){for(const[k,v]of Object.entries(obj)){y+=sp+k+': '+yamlVal(v,indent)+'\n';}}else{y=sp+String(obj)+'\n';}return y;}
function yamlVal(v,indent){if(Array.isArray(v)){return'\n'+objToYAML(v,indent+2).trimEnd();}if(typeof v==='object'&&v!==null)return'\n'+objToYAML(v,indent+2).trimEnd();return JSON.stringify(v);}
function showErr(msg){document.getElementById('output').innerHTML='<span class="err">Error: '+msg+'</span>';}
function showStats(d){const str=JSON.stringify(d);const bytes=new Blob([str]).size;const keys=countKeys(d);document.getElementById('stats').innerHTML='<span class="stat">Size: '+(bytes/1024).toFixed(2)+' KB</span><span class="stat">Characters: '+str.length+'</span><span class="stat">Keys: '+keys+'</span><span class="stat">Depth: '+depth(d)+'</span>';}
function countKeys(o){if(typeof o!=='object'||o===null)return 0;let c=Array.isArray(o)?0:Object.keys(o).length;for(const v of Object.values(o))c+=countKeys(v);return c;}
function depth(o){if(typeof o!=='object'||o===null)return 0;let d=0;for(const v of Object.values(o))d=Math.max(d,depth(v));return d+1;}
function copyOut(){navigator.clipboard.writeText(document.getElementById('output').textContent);alert('Output copied!');}
format();
</script>
</body></html>
