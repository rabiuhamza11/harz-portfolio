<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HARZ Analytics Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0A0A0F;--card:#13131a;--border:#22223a;--text:#e0e0e0;--muted:#666;--gold:#F59E0B;--green:#00e676;--blue:#3b82f6;--cyan:#00bcd4;--red:#EF4444;--purple:#7C4DFF}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:600px;margin:0 auto;padding:16px}
.header{text-align:center;padding:16px 0}
.header h1{font-size:1.4rem;font-weight:900}
.header h1 span{color:var(--gold)}
.back-link{display:inline-block;margin-bottom:12px;font-size:.75rem;color:var(--cyan);text-decoration:none}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.stat-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:1.8rem;font-weight:800;margin-top:4px}
.stat-sub{font-size:.7rem;color:var(--muted);margin-top:2px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.chart-title{font-size:.8rem;font-weight:700;margin-bottom:8px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:12px}
.bar{flex:1;background:linear-gradient(180deg,var(--gold),rgba(245,158,11,.2));border-radius:4px 4px 0 0;min-height:4px;transition:.3s;position:relative}
.bar:hover{filter:brightness(1.2)}
.bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.55rem;color:var(--muted);white-space:nowrap}
.bar-value{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.5rem;color:var(--gold);white-space:nowrap}
.method-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.method-row{display:flex;justify-content:space-between;align-items:center}
.method-name{font-size:.8rem;font-weight:600}
.method-stats{font-size:.75rem;color:var(--muted)}
.method-bar{height:6px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden}
.method-fill{height:100%;border-radius:3px;transition:.5s}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.product-name{font-size:.75rem;font-weight:600}
.product-count{font-size:.7rem;color:var(--muted)}
.product-volume{font-size:.8rem;font-weight:700;color:var(--green)}
.loading{text-align:center;padding:40px;color:var(--muted)}
.spin{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
<a href="harz-super-app.html" class="back-link">← Back</a>
<div class="header">
<h1>HARZ <span>Analytics</span></h1>
</div>

<div id="content">
<div class="loading"><span class="spin"></span>Loading analytics...</div>
</div>
</div>

<script>
const BACKEND_URL="https://solene-5b0577e2.base44.app/functions/harzPayments";

async function loadAnalytics(){
  try{
    const resp=await fetch(BACKEND_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'analytics'})
    });
    const data=await resp.json();
    if(data.status&&data.analytics){
      renderAnalytics(data.analytics);
    }else{
      document.getElementById('content').innerHTML='<div class="loading">Failed to load analytics</div>';
    }
  }catch(e){
    document.getElementById('content').innerHTML='<div class="loading">Connection error</div>';
  }
}

function renderAnalytics(a){
  var maxRev=Math.max.apply(null,a.daily_revenue.map(function(d){return d.val}))||1;
  var bars=a.daily_revenue.map(function(d){
    var h=Math.round((d.val/maxRev)*100);
    var day=new Date(d.date).toLocaleDateString('en',{weekday:'short'}).charAt(0);
    return '<div class="bar" style="height:'+h+'%"><div class="bar-value">'+(d.val>0?'₦'+(d.val/1000).toFixed(0)+'k':'')+'</div><div class="bar-label">'+day+'</div></div>';
  }).join('');
  
  var methods=Object.keys(a.by_method).map(function(m){
    var info=a.by_method[m];
    var pct=info.count>0?Math.round((info.count/a.total_transactions)*100):0;
    var color=m==='paystack'?'var(--green)':m==='crypto'?'var(--gold)':m==='bank_transfer'?'var(--blue)':m==='wallet'?'var(--cyan)':'var(--muted)';
    return '<div class="method-card"><div class="method-row"><div class="method-name">'+m.replace(/_/g,' ')+'</div><div class="method-stats">'+info.count+' txns · ₦'+info.volume.toLocaleString()+'</div></div><div class="method-bar"><div class="method-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
  }).join('');
  
  var products=Object.keys(a.by_product).map(function(p){
    var info=a.by_product[p];
    return '<div class="product-card"><div><div class="product-name">'+p+'</div><div class="product-count">'+info.count+' orders</div></div><div class="product-volume">₦'+info.volume.toLocaleString()+'</div></div>';
  }).join('');
  
  document.getElementById('content').innerHTML=
    '<div class="stat-grid">'+
      '<div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value" style="color:var(--gold)">₦'+a.total_revenue.toLocaleString()+'</div><div class="stat-sub">'+a.paid+' paid transactions</div></div>'+
      '<div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" style="color:var(--blue)">₦'+(a.pending)+'</div><div class="stat-sub">'+a.pending+' pending orders</div></div>'+
      '<div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value">'+a.total_transactions+'</div><div class="stat-sub">All methods</div></div>'+
      '<div class="stat-card"><div class="stat-label">Avg Order</div><div class="stat-value" style="color:var(--green)">₦'+(a.paid>0?Math.round(a.total_revenue/a.paid).toLocaleString():0)+'</div><div class="stat-sub">Per paid order</div></div>'+
    '</div>'+
    '<div class="chart-card"><div class="chart-title">Revenue (Last 7 Days)</div><div class="bar-chart">'+bars+'</div></div>'+
    '<div class="chart-card"><div class="chart-title">Payment Methods</div>'+methods+'</div>'+
    '<div class="chart-card"><div class="chart-title">Top Products</div>'+products+'</div>';
}

loadAnalytics();
setInterval(loadAnalytics,60000);
</script>
</body>
</html>
