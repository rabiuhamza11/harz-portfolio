<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARZ Notes</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--p1:#7c4dff;--p2:#5362f6;--p3:#00d4aa}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:70px}
.header{position:sticky;top:0;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;border-bottom:1px solid var(--border)}
.header h1{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search-bar{padding:10px 16px 0}
.search-bar input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:.85rem}
.search-bar input:focus{outline:none;border-color:var(--p1)}
.cat-tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
.cat-tab{padding:6px 14px;border-radius:20px;font-size:.72rem;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--border);cursor:pointer}
.cat-tab.active{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent;color:#fff}
.note-list{padding:0 16px}
.note-card{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--p1);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;transition:.2s}
.note-card:active{transform:scale(.98)}
.note-card.school{border-left-color:#3b82f6}
.note-card.farm{border-left-color:#22c55e}
.note-card.construction{border-left-color:#f59e0b}
.note-card.business{border-left-color:#a855f7}
.note-card.personal{border-left-color:var(--p3)}
.note-title{font-size:.88rem;font-weight:600;margin-bottom:4px}
.note-preview{font-size:.75rem;color:var(--muted);line-height:1.5;white-space:pre-wrap;overflow:hidden;max-height:3.6em}
.note-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:.62rem;color:var(--muted)}
.note-cat{text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.note-cat.school{color:#3b82f6}
.note-cat.farm{color:#22c55e}
.note-cat.construction{color:#f59e0b}
.note-cat.business{color:#a855f7}
.note-cat.personal{color:var(--p3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:1.1rem;margin-bottom:14px}
.form-group{margin-bottom:10px}
.form-label{font-size:.72rem;color:var(--muted);margin-bottom:4px;display:block}
.form-input,.form-select,.form-textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;font-size:.85rem;font-family:inherit}
.form-textarea{resize:vertical;min-height:120px;line-height:1.5}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--p1)}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:10px;font-size:.85rem;font-weight:600;border:none;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.btn-cancel{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.btn-danger{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.fab{position:fixed;bottom:16px;right:16px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p2));border:none;color:#fff;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 20px rgba(124,77,255,.4);z-index:90;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:20px;font-size:.78rem;z-index:400;opacity:0;transition:.3s}
.toast.show{opacity:1;bottom:90px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .emoji{font-size:2.5rem;margin-bottom:8px}
</style>
</head>
<body>
<div class="header"><h1>📝 HARZ Notes</h1></div>
<div class="search-bar"><input type="text" id="searchInput" placeholder="🔍 Search notes..." oninput="render()"></div>
<div class="cat-tabs" id="catTabs"></div>
<div class="note-list" id="noteList"></div>
<button class="fab" onclick="openModal()">+</button>
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h2 id="modalTitle">New Note</h2>
<div class="form-group"><label class="form-label">Title</label><input class="form-input" id="nTitle" placeholder="Note title"></div>
<div class="form-group"><label class="form-label">Category</label>
<select class="form-select" id="nCat">
<option value="school">🏫 School</option>
<option value="farm">🌾 Farm</option>
<option value="construction">🏗️ Construction</option>
<option value="business">💼 Business</option>
<option value="personal">👤 Personal</option>
</select></div>
<div class="form-group"><label class="form-label">Content</label><textarea class="form-textarea" id="nContent" placeholder="Write your note..."></textarea></div>
<div class="modal-actions">
<button class="btn btn-danger" id="delBtn" style="display:none" onclick="delNote()">Delete</button>
<button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
<button class="btn btn-primary" onclick="saveNote()">Save</button>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const catLabels={school:'School',farm:'Farm',construction:'Build',business:'Biz',personal:'Personal'};
let notes=[],activeCat='all',editingId=null;
function load(){try{notes=JSON.parse(localStorage.getItem('harz_notes')||'[]')}catch(e){notes=[]}}
function save(){localStorage.setItem('harz_notes',JSON.stringify(notes))}
function seed(){
if(notes.length>0)return;
const s=[
{title:'PTA Meeting Agenda',cat:'school',content:'1. Term results review\n2. Fee payment status\n3. Next term calendar\n4. Staff performance\n5. New classroom construction update'},
{title:'Tomato Plot A Status',cat:'farm',content:'Planted: June 15\nExpected harvest: August 20\nCurrent status: Flowering stage\nNeed: Stake supports, pesticide spray this week\nEstimated yield: 200 crates'},
{title:'Wuse Duplex Progress',cat:'construction',content:'Foundation: Complete\nBlock work: 60% done\nNext: Roofing — start August 5\nCement ordered: 200 bags\nLabor: 8 workers on site'},
{title:'HarzDM Sales Ideas',cat:'business',content:'1. Bundle AI Agency + Dev Platform for ₦35K\n2. Add WhatsApp ordering for local customers\n3. Offer 10% discount for GDEG payments\n4. Partner with local tech shops'},
{title:'Books to Read',cat:'personal',content:'1. Rich Dad Poor Dad — Kiyosaki\n2. The Alchemist — Coelho\n3. Physics of the Impossible — Kaku\n4. Modern Architecture in Nigeria'}
];
s.forEach(n=>{n.id=Math.random().toString(36).substr(2,9);n.created=new Date().toISOString();notes.push(n)});
save();
}
function timeAgo(iso){const d=new Date(iso);const diff=Date.now()-d.getTime();const days=Math.floor(diff/86400000);if(days===0)return'Today';if(days===1)return'Yesterday';if(days<7)return days+'d ago';return d.toLocaleDateString('en-NG',{month:'short',day:'numeric'})}
function render(){
const search=document.getElementById('searchInput').value.toLowerCase();
const filtered=notes.filter(n=>{
if(activeCat!=='all'&&n.cat!==activeCat)return false;
if(search&&!n.title.toLowerCase().includes(search)&&!n.content.toLowerCase().includes(search))return false;
return true;
}).sort((a,b)=>new Date(b.created)-new Date(a.created));
const cats=['all',...Object.keys(catLabels)];
document.getElementById('catTabs').innerHTML=cats.map(t=>`<div class="cat-tab ${activeCat===t?'active':''}" onclick="setCat('${t}')">${t==='all'?'All':catLabels[t]}</div>`).join('');
const list=document.getElementById('noteList');
if(filtered.length===0){list.innerHTML='<div class="empty"><div class="emoji">📝</div><p>No notes. Tap + to write.</p></div>';return}
list.innerHTML=filtered.map(n=>`
<div class="note-card ${n.cat}" onclick="editNote('${n.id}')">
<div class="note-title">${esc(n.title)}</div>
<div class="note-preview">${esc(n.content)}</div>
<div class="note-meta">
<span class="note-cat ${n.cat}">${catLabels[n.cat]}</span>
<span>${timeAgo(n.created)}</span>
</div>
</div>`).join('');
}
function setCat(c){activeCat=c;render()}
function openModal(){editingId=null;document.getElementById('modalTitle').textContent='New Note';document.getElementById('nTitle').value='';document.getElementById('nCat').value='school';document.getElementById('nContent').value='';document.getElementById('delBtn').style.display='none';document.getElementById('modalOverlay').classList.add('show')}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
function editNote(id){const n=notes.find(x=>x.id===id);if(!n)return;editingId=id;document.getElementById('modalTitle').textContent='Edit Note';document.getElementById('nTitle').value=n.title;document.getElementById('nCat').value=n.cat;document.getElementById('nContent').value=n.content;document.getElementById('delBtn').style.display='block';document.getElementById('modalOverlay').classList.add('show')}
function saveNote(){const title=document.getElementById('nTitle').value.trim();if(!title){showToast('Enter a title');return}
const data={title,cat:document.getElementById('nCat').value,content:document.getElementById('nContent').value};
if(editingId){Object.assign(notes.find(n=>n.id===editingId),data)}else{data.id=Math.random().toString(36).substr(2,9);data.created=new Date().toISOString();notes.push(data)}
save();closeModal();render();showToast('Note saved ✓')}
function delNote(){if(!editingId)return;if(confirm('Delete this note?')){notes=notes.filter(n=>n.id!==editingId);save();closeModal();render();showToast('Deleted')}}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
load();seed();render();
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal()});
</script>
</body>
</html>
