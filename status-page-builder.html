<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status Page Builder — HARZ Toolkit</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}.c{max-width:800px;margin:0 auto}h1{text-align:center;font-size:1.8rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}.sub{text-align:center;color:#94a3b8;margin-bottom:30px;font-size:.9rem}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;margin-bottom:20px}.card h2{font-size:1.1rem;margin-bottom:16px;color:#60a5fa}.fg{margin-bottom:14px}.fg label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:5px}.fg input{width:100%;padding:10px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:.9rem}.service-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.service-row input{flex:1;padding:8px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:.85rem}.service-row select{padding:8px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:.85rem;max-width:130px}.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.dot-op{background:#22c55e}.dot-down{background:#ef4444}.dot-deg{background:#f59e0b}.dot-maint{background:#3b82f6}.btn{padding:10px 20px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-size:.9rem}.btn.sec{background:#334155}.out{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;font-family:monospace;font-size:.8rem;color:#a5b4fc;max-height:500px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}.preview{background:#fff;color:#1e293b;border-radius:12px;padding:24px;margin-top:16px}.preview-header{text-align:center;margin-bottom:20px}.preview-title{font-size:1.5rem;font-weight:bold}.preview-overall{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;background:#dcfce7;border-radius:20px;color:#166534;font-size:.9rem;margin-top:8px}.preview-svc{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e2e8f0}.preview-svc:last-child{border:0}</style>
</head>
<body>
<div class="c">
<h1>Status Page Builder</h1><p class="sub">Generate a status page for your services</p>
<div class="card"><h2>Configuration</h2>
<div class="fg"><label>Site Name</label><input id="siteName" value="HARZ Cloud Status" oninput="generate()"></div>
<div class="fg"><label>Description</label><input id="description" value="Real-time status of HARZ AI Operating System services" oninput="generate()"></div>
</div>
<div class="card"><h2>Services</h2>
<div id="services"></div>
<button class="btn sec" onclick="addService()" style="margin-top:8px">+ Add Service</button>
</div>
<div class="card"><h2>Preview</h2><div class="preview" id="preview"></div></div>
<div class="card"><h2>Generated HTML</h2><div class="out" id="output"></div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="copyHTML()">Copy HTML</button><button class="btn sec" onclick="downloadHTML()">Download</button></div></div>
</div>
<script>
let services=[{name:'Cloudflare Pages',status:'operational'},{name:'Magani Agent',status:'operational'},{name:'HARZ Pay',status:'operational'},{name:'Paystack',status:'operational'},{name:'NowPayments',status:'degraded'},{name:'Telegram Bot',status:'operational'}];
const statusMap={'operational':'Operational','degraded':'Degraded','down':'Down','maintenance':'Maintenance'};
const dotMap={'operational':'dot-op','degraded':'dot-deg','down':'dot-down','maintenance':'dot-maint'};
function addService(){services.push({name:'',status:'operational'});render();generate();}
function deleteSvc(i){services.splice(i,1);render();generate();}
function render(){document.getElementById('services').innerHTML=services.map((s,i)=>'<div class="service-row"><input value="'+s.name+'" placeholder="Service name" oninput="services['+i+'].name=this.value;generate()"><select onchange="services['+i+'].status=this.value;render();generate()"><option value="operational" '+(s.status==='operational'?'selected':'')+'>Operational</option><option value="degraded" '+(s.status==='degraded'?'selected':'')+'>Degraded</option><option value="down" '+(s.status==='down'?'selected':'')+'>Down</option><option value="maintenance" '+(s.status==='maintenance'?'selected':'')+'>Maintenance</option></select><div class="status-dot '+dotMap[s.status]+'"></div><button class="btn sec" onclick="deleteSvc('+i+')" style="padding:4px 10px;font-size:.8rem">x</button></div>').join('');}
function generate(){const name=document.getElementById('siteName').value,desc=document.getElementById('description').value;const operational=services.filter(s=>s.status==='operational').length;const total=services.length;const allUp=operational===total;
const preview='<div class="preview-header"><div class="preview-title">'+name+'</div><div style="color:#64748b;font-size:.9rem;margin-top:4px">'+desc+'</div><div class="preview-overall"><span style="width:8px;height:8px;border-radius:50%;background:'+(allUp?'#22c55e':'#f59e0b')+';display:inline-block"></span>'+(allUp?'All Systems Operational':(total-operational)+' Service'+(total-operational>1?'s':'')+' Experiencing Issues')+'</div></div><div style="margin-top:16px">'+services.map(s=>'<div class="preview-svc"><div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:'+({operational:'#22c55e',degraded:'#f59e0b',down:'#ef4444',maintenance:'#3b82f6'}[s.status])+';display:inline-block"></span><span style="font-weight:600">'+s.name+'</span></div><span style="font-size:.85rem;color:'+({operational:'#166534',degraded:'#92400e',down:'#991b1b',maintenance:'#1e40af'}[s.status])+'">'+statusMap[s.status]+'</span></div>').join('')+'</div>';
document.getElementById('preview').innerHTML=preview;
const html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+name+'</title><style>body{font-family:system-ui;margin:0;padding:40px;background:#f8fafc;color:#1e293b}.container{max-width:600px;margin:0 auto}.header{text-align:center;margin-bottom:32px}.header h1{font-size:1.75rem}.status-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:20px;font-size:.9rem;margin-top:12px}.all-up{background:#dcfce7;color:#166534}.some-down{background:#fef3c7;color:#92400e}.service{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #e2e8f0}.service-name{font-weight:600}.service-status{font-size:.85rem}</style></head><body><div class="container"><div class="header"><h1>'+name+'</h1><p style="color:#64748b">'+desc+'</p><div class="status-badge '+(allUp?'all-up':'some-down')+'"><span style="width:10px;height:10px;border-radius:50%;background:'+(allUp?'#22c55e':'#f59e0b')+'"></span>'+(allUp?'All Systems Operational':(total-operational)+' Services Experiencing Issues')+'</div></div>'+services.map(s=>'<div class="service"><div class="service-name">'+s.name+'</div><div class="service-status" style="color:'+({operational:'#166534',degraded:'#92400e',down:'#991b1b',maintenance:'#1e40af'}[s.status])+'">'+statusMap[s.status]+'</div></div>').join('')+'<div style="text-align:center;padding:20px;font-size:.8rem;color:#94a3b8">Updated: '+new Date().toISOString()+'</div></div></body></html>';
document.getElementById('output').textContent=html;}
function copyHTML(){navigator.clipboard.writeText(document.getElementById('output').textContent);alert('Status page HTML copied!');}
function downloadHTML(){var b=new Blob([document.getElementById('output').textContent],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='status.html';a.click();}
render();generate();
</script>
</body></html>
