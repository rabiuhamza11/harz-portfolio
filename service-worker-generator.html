<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Worker Generator — HARZ Toolkit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
h1{text-align:center;margin-bottom:8px;font-size:1.8rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#94a3b8;margin-bottom:30px;font-size:.9rem}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;margin-bottom:20px}
.card h2{font-size:1.1rem;margin-bottom:16px;color:#60a5fa}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:.9rem}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#3b82f6}
.checkbox{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.checkbox input{width:18px;height:18px;accent-color:#3b82f6}
.btn{padding:12px 24px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-size:.9rem}
.btn.secondary{background:#334155}
.output{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:16px;font-family:monospace;font-size:.8rem;white-space:pre-wrap;word-break:break-all;max-height:500px;overflow-y:auto;color:#a5b4fc}
.actions{display:flex;gap:10px;margin-top:16px}
</style>
</head>
<body>
<div class="container">
<h1>Service Worker Generator</h1>
<p class="sub">Generate a service worker for offline caching and PWA support</p>
<div class="card">
<h2>Configuration</h2>
<div class="form-group"><label>Cache Name</label><input id="cacheName" value="harz-cache-v1" oninput="generate()"></div>
<div class="form-group"><label>Cache Strategy</label><select id="strategy" onchange="generate()"><option value="cache-first">Cache First (fast, for static assets)</option><option value="network-first">Network First (fresh, for API/data)</option><option value="stale-while-revalidate">Stale While Revalidate (balanced)</option><option value="cache-only">Cache Only (offline-only)</option><option value="network-only">Network Only (online-only)</option></select></div>
<div class="form-group"><label>Pre-cache URLs (comma-separated)</label><input id="precache" value="/, /index.html, /offline.html, /styles.css, /app.js" oninput="generate()"></div>
<div class="checkbox"><input type="checkbox" id="offlinePage" checked onchange="generate()"><label for="offlinePage">Generate offline fallback page</label></div>
<div class="checkbox"><input type="checkbox" id="skipWaiting" checked onchange="generate()"><label for="skipWaiting">Enable skipWaiting</label></div>
<div class="checkbox"><input type="checkbox" id="clientsClaim" checked onchange="generate()"><label for="clientsClaim">Enable clientsClaim</label></div>
<div class="checkbox"><input type="checkbox" id="notifications" onchange="generate()"><label for="notifications">Add push notification support</label></div>
<div class="checkbox"><input type="checkbox" id="backgroundSync" onchange="generate()"><label for="backgroundSync">Add background sync support</label></div>
</div>
<div class="card">
<h2>Generated sw.js</h2>
<div class="output" id="output"></div>
<div class="actions">
<button class="btn" onclick="copyOutput()">Copy Code</button>
<button class="btn secondary" onclick="downloadSW()">Download sw.js</button>
</div>
</div>
<div class="card">
<h2>Registration Code</h2>
<div class="output" id="regCode"></div>
<button class="btn" onclick="copyReg()" style="margin-top:10px">Copy Registration</button>
</div>
</div>
<script>
function generate(){
const cacheName=document.getElementById('cacheName').value;
const strategy=document.getElementById('strategy').value;
const precache=document.getElementById('precache').value.split(',').map(s=>s.trim()).filter(Boolean);
const offline=document.getElementById('offlinePage').checked;
const skipWaiting=document.getElementById('skipWaiting').checked;
const clientsClaim=document.getElementById('clientsClaim').checked;
const notif=document.getElementById('notifications').checked;
const bgSync=document.getElementById('backgroundSync').checked;

let code=`// Service Worker — Generated by HARZ Toolkit\nconst CACHE_NAME='${cacheName}';\nconst PRECACHE_URLS=${JSON.stringify(precache,null,2)};\n\n`;
code+=`// Install — pre-cache critical resources\nself.addEventListener('install', event => {\n  event.waitUntil(\n    caches.open(CACHE_NAME).then(cache => cache.addAll(PRECACHE_URLS))\n`;
if(skipWaiting)code+=`  ).then(() => self.skipWaiting())\n`;
code+=`  );\n});\n\n`;

code+=`// Activate — clean old caches\nself.addEventListener('activate', event => {\n  event.waitUntil(\n    caches.keys().then(names => Promise.all(\n      names.filter(n => n !== CACHE_NAME).map(n => caches.delete(n))\n    ))\n`;
if(clientsClaim)code+=`  ).then(() => self.clients.claim())\n`;
code+=`  );\n});\n\n`;

if(strategy==='cache-first'){
code+=`// Fetch — Cache First strategy\nself.addEventListener('fetch', event => {\n  event.respondWith(\n    caches.match(event.request).then(cached => {\n      return cached || fetch(event.request).then(response => {\n        const clone = response.clone();\n        caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));\n        return response;\n      })`;
if(offline)code+=`).catch(() => caches.match('/offline.html'))`;
code+=`;\n    })\n  );\n});\n`;
}else if(strategy==='network-first'){
code+=`// Fetch — Network First strategy\nself.addEventListener('fetch', event => {\n  event.respondWith(\n    fetch(event.request).then(response => {\n      const clone = response.clone();\n      caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));\n      return response;\n    }).catch(() => caches.match(event.request)`;
if(offline)code+=`.then(c => c || caches.match('/offline.html'))`;
code+=`)\n  );\n});\n`;
}else if(strategy==='stale-while-revalidate'){
code+=`// Fetch — Stale While Revalidate strategy\nself.addEventListener('fetch', event => {\n  event.respondWith(\n    caches.match(event.request).then(cached => {\n      const fetchPromise = fetch(event.request).then(response => {\n        const clone = response.clone();\n        caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));\n        return response;\n      })`;
if(offline)code+=`.catch(() => caches.match('/offline.html'))`;
code+=`;\n      return cached || fetchPromise;\n    })\n  );\n});\n`;
}else if(strategy==='cache-only'){
code+=`// Fetch — Cache Only strategy\nself.addEventListener('fetch', event => {\n  event.respondWith(caches.match(event.request)`;
if(offline)code+=`.then(c => c || caches.match('/offline.html'))`;
code+=`);\n});\n`;
}else{
code+=`// Fetch — Network Only strategy\nself.addEventListener('fetch', event => {\n  event.respondWith(fetch(event.request)`;
if(offline)code+=`.catch(() => caches.match('/offline.html'))`;
code+=`);\n});\n`;
}

if(notif){
code+=`\n// Push Notifications\nself.addEventListener('push', event => {\n  const data = event.data ? event.data.json() : {};\n  event.waitUntil(\n    self.registration.showNotification(data.title || 'HARZ Notification', {\n      body: data.body || '',\n      icon: data.icon || '/icon-192.png',\n      badge: data.badge || '/icon-96.png',\n      data: data.url || '/'\n    })\n  );\n});\n\nself.addEventListener('notificationclick', event => {\n  event.notification.close();\n  event.waitUntil(clients.openWindow(event.notification.data));\n});\n`;
}

if(bgSync){
code+=`\n// Background Sync\nself.addEventListener('sync', event => {\n  if (event.tag === 'harz-sync') {\n    event.waitUntil(syncPendingRequests());\n  }\n});\n\nasync function syncPendingRequests() {\n  const cache = await caches.open(CACHE_NAME + '-pending');\n  const requests = await cache.keys();\n  for (const req of requests) {\n    try {\n      const response = await fetch(req);\n      if (response.ok) await cache.delete(req);\n    } catch (e) { console.log('Sync retry needed'); }\n  }\n}\n`;
}

document.getElementById('output').textContent=code;

const reg=`// Register Service Worker\nif ('serviceWorker' in navigator) {\n  window.addEventListener('load', () => {\n    navigator.serviceWorker.register('/sw.js')\n      .then(reg => console.log('SW registered:', reg.scope))\n      .catch(err => console.log('SW registration failed:', err));\n  });\n}`;
document.getElementById('regCode').textContent=reg;
}
function copyOutput(){navigator.clipboard.writeText(document.getElementById('output').textContent);alert('Service Worker code copied!');}
function copyReg(){navigator.clipboard.writeText(document.getElementById('regCode').textContent);alert('Registration code copied!');}
function downloadSW(){var b=new Blob([document.getElementById('output').textContent],{type:'application/javascript'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sw.js';a.click();}
generate();
</script>
</body>
</html>
